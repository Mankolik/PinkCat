<title>Pink Cat Clan Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fira+Sans:wght@500;600;700&display=swap">
<style id="app-style">
/* Layout: in-game windows floating over a dark block world. A gold-framed clan window holds totals and the
   member list, staff tools sit in a second window, and a hotbar-style countdown is pinned to the bottom.
   One deliberate look (the game's own UI), so no separate light/dark palettes. */
:root {
  --world: #0a1424;        /* night sky behind the blocks */
  --block: #1b2738;        /* background block faces */
  --block-edge: #26354a;
  --gold: #f6c700;         /* window frame */
  --gold-dk: #9a7a00;
  --olive: #a7bb1d;        /* frame inner bevel */
  --olive-dk: #74870d;
  --cream: #f6efd3;        /* window body */
  --cyan: #a3def0;         /* stat rows */
  --cyan-dk: #6fc0dc;
  --banner: #7dd0f0;       /* title pill */
  --banner-dk: #2f8ec4;
  --navy: #1d5b86;         /* labels, pills */
  --ink: #163a57;          /* text on light surfaces */
  --white: #ffffff;
  --orange: #ffa21f;       /* main button */
  --orange-dk: #e26a00;
  --gem: #1777c2;
  --xp: #3b9a0e;
  --bar: #57c81c;          /* progress bar green */
  --warn: #b77b00;
  --bad: #d23b22;
  --leader: #8e3fe0;
  --elder: #2f9e1e;
  --veteran: #1f74c8;
  --member: #5b6b7a;
  --font-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --font-body: "Fira Sans", "Segoe UI", system-ui, sans-serif;
  --outline: 0 2px 0 var(--ink), 0 -2px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink),
             1.5px 1.5px 0 var(--ink), -1.5px 1.5px 0 var(--ink), 1.5px -1.5px 0 var(--ink), -1.5px -1.5px 0 var(--ink), 0 4px 0 rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  background-color: var(--world);
  /* stone blocks: 64px tiles with a darker seam and a lighter top-left bevel */
  background-image:
    linear-gradient(rgba(10, 20, 36, .55), rgba(10, 20, 36, .85)),
    linear-gradient(90deg, var(--block-edge) 0 3px, transparent 3px),
    linear-gradient(var(--block-edge) 0 3px, transparent 3px),
    linear-gradient(135deg, #223146 0 30%, var(--block) 30% 100%);
  background-size: auto, 64px 64px, 64px 64px, 64px 64px;
  background-attachment: fixed;
}
.wrap { max-width: 1040px; margin: 0 auto; padding-inline: 16px; padding-block: 44px 130px; display: grid; gap: 46px; }
.wrap > *, .window-in > *, .editor > *, .panel > *, .cards > * { min-width: 0; }
input, select { max-width: 100%; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: .01em; }
h2 { font-size: 22px; }
h3 { font-size: 18px; }
p { margin: 0; }
.muted { color: color-mix(in srgb, var(--ink) 62%, var(--cream)); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.gem { color: var(--gem); }
.xp { color: var(--xp); }
.ico { display: inline-block; width: 15px; height: 15px; vertical-align: -2px; margin-right: 5px; }
.outlined { color: var(--white); text-shadow: var(--outline); }

/* ---------- game window ---------- */
.window {
  position: relative; border-radius: 16px; padding: 12px;
  background: linear-gradient(var(--olive), var(--olive-dk));
  border: 5px solid var(--gold);
  box-shadow: 0 0 0 2px var(--gold-dk), inset 0 0 0 2px rgba(255,255,255,.35), 0 18px 40px rgba(0,0,0,.55);
}
.window-in { background: var(--cream); border-radius: 10px; padding: 34px 14px 14px; display: grid; gap: 14px; box-shadow: inset 0 2px 0 rgba(0,0,0,.08); }
.banner {
  position: absolute; left: 50%; top: 0; transform: translate(-50%, -55%);
  max-width: calc(100% - 32px); width: max-content; padding: 8px 34px 10px;
  border-radius: 999px; border: 3px solid var(--banner-dk);
  background: linear-gradient(#b6e9fb 0 40%, var(--banner) 40% 100%);
  box-shadow: inset 0 -4px 0 rgba(0,0,0,.12), 0 3px 0 rgba(0,0,0,.25);
  font-size: clamp(22px, 5.4vw, 34px); line-height: 1.1; text-align: center; white-space: nowrap;
  color: var(--white); text-shadow: var(--outline);
}
.banner .tag { color: #ffc6ea; }

.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; }
.top .sub { max-width: 60ch; color: var(--ink); }
.period-pick { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pill { display: inline-block; background: var(--navy); color: var(--white); border-radius: 999px; padding: 3px 12px; font-weight: 700; font-size: 13px; box-shadow: inset 0 -2px 0 rgba(0,0,0,.25); }

select, input, button { font: inherit; }
select, input[type=text], input[type=password], input[type=number], input[type=datetime-local] {
  background: var(--white); color: var(--ink); border: 2px solid var(--navy); border-radius: 4px; padding: 6px 10px; min-width: 0; font-weight: 600;
  box-shadow: inset 0 2px 0 rgba(0,0,0,.08); color-scheme: light;
}
select:focus-visible, input:focus-visible, button:focus-visible, summary:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }

/* sky-blue game button; .primary is the orange "Close"-style button */
button {
  cursor: pointer; border-radius: 10px; padding: 6px 16px; font-family: var(--font-display); font-size: 16px; letter-spacing: .02em;
  color: var(--white); text-shadow: 0 1px 0 var(--ink), 0 -1px 0 var(--ink), 1px 0 0 var(--ink), -1px 0 0 var(--ink), 0 2px 0 var(--ink);
  background: linear-gradient(#a9e4f8 0 45%, #5fbde6 45% 100%); border: 3px solid var(--banner-dk);
  box-shadow: inset 0 -3px 0 rgba(0,0,0,.15), 0 3px 0 rgba(0,0,0,.3);
}
button:hover { filter: brightness(1.07); }
button:active { transform: translateY(2px); box-shadow: inset 0 -1px 0 rgba(0,0,0,.15), 0 1px 0 rgba(0,0,0,.3); }
button.primary { background: linear-gradient(#ffc04a 0 45%, var(--orange) 45% 100%); border-color: #4aa8dc; box-shadow: inset 0 -3px 0 var(--orange-dk), 0 0 0 2px #1f6f9f, 0 4px 0 rgba(0,0,0,.35); }
button.danger { background: linear-gradient(#ff9a86 0 45%, #e5533a 45% 100%); border-color: #9b2a17; }
button.link { background: none; border: 0; box-shadow: none; padding: 0; font-family: var(--font-body); font-size: 14px; font-weight: 700; color: var(--banner-dk); text-shadow: none; text-decoration: underline; }
button:disabled { opacity: .5; cursor: default; filter: grayscale(.5); }

/* ---------- totals: rows like the clan perk list ---------- */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
.tile {
  background: var(--cyan); border-radius: 8px; padding: 10px 12px; display: grid; gap: 8px;
  box-shadow: inset 0 -3px 0 var(--cyan-dk), inset 0 2px 0 rgba(255,255,255,.5);
}
.tile .eyebrow { justify-self: start; background: var(--navy); color: var(--white); border-radius: 999px; padding: 3px 12px; font-size: 13px; font-weight: 700; }
.tile .eyebrow .ico { color: var(--white); }
.tile .big { background: var(--white); border: 2px solid var(--navy); border-radius: 4px; padding: 2px 10px; text-align: right; font-family: var(--font-display); font-size: 28px; line-height: 1.2; }
.tile .big.gem, .tile .big.xp { }
.tile .big .muted { font-family: var(--font-body); font-weight: 600; }
@media (max-width: 560px) {
  .tiles { gap: 6px; }
  .tile { grid-template-columns: 1fr auto; align-items: center; padding: 8px 10px; }
  .tile .big { font-size: 22px; min-width: 4.6em; }
  .tile .eyebrow { border-radius: 10px; font-size: 12px; }
  .wrap { padding-inline: 10px; }
  .window, .editor { border-width: 4px; padding: 8px; }
  .editor { padding-top: 40px; }
  .window-in { padding: 30px 10px 10px; }
  .banner { padding: 6px 22px 8px; }
}

/* ---------- member list ---------- */
.board { background: var(--cyan); border-radius: 10px; overflow: hidden; box-shadow: inset 0 -3px 0 var(--cyan-dk); }
.board-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 16px; padding: 10px 14px; background: var(--navy); color: var(--white); }
.board-head h2 { color: var(--white); text-shadow: 0 2px 0 rgba(0,0,0,.35); }
.board-head p { color: #d6effa; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: separate; border-spacing: 0 4px; padding: 0 6px 6px; }
th, td { padding: 8px 10px; text-align: right; }
th:nth-child(1), td:nth-child(1), th:nth-child(2), td:nth-child(2) { text-align: left; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--navy); white-space: nowrap; font-weight: 700; padding-top: 10px; }
th button { background: none; border: 0; box-shadow: none; padding: 0; font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit; text-shadow: none; }
th button[aria-sort] { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
tbody td { background: var(--cream); color: var(--ink); }
tbody tr:nth-child(even) td { background: #ece4c6; }
tbody td:first-child { border-radius: 8px 0 0 8px; }
tbody td:last-child { border-radius: 0 8px 8px 0; }
tbody tr:hover td { background: var(--white); }
td.rankno { font-family: var(--font-display); font-size: 18px; color: var(--navy); width: 1%; }
tbody tr:nth-child(1) td.rankno { color: #d9a400; }
tbody tr:nth-child(2) td.rankno { color: #8d9aa8; }
tbody tr:nth-child(3) td.rankno { color: #b36a2a; }
.who { display: grid; gap: 2px; }
.who b { font-size: 16px; font-weight: 700; }
.chip { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--member); color: var(--white); white-space: nowrap; }
.chip.r-leader, .chip.leader { background: var(--leader); }
.chip.r-coleader { background: #b04fc9; }
.chip.r-elder { background: var(--elder); }
.chip.r-veteran { background: var(--veteran); }
.chip.warn { background: #ffe9a6; color: #7a5200; }
.gain { font-weight: 700; }
.gain.gem { color: var(--gem); }
.gain.xp { color: var(--xp); }
.gain.zero { color: var(--member); font-weight: 500; }
.empty { padding: 28px 16px; text-align: center; display: grid; gap: 6px; justify-items: center; }

/* ---------- staff tools ---------- */
.editor-gate { background: linear-gradient(var(--olive), var(--olive-dk)); border: 4px solid var(--gold); border-radius: 12px; box-shadow: 0 0 0 2px var(--gold-dk); padding: 12px; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; color: var(--white); }
.editor-gate h3 { color: var(--white); text-shadow: var(--outline); }
.editor-gate p { color: #f4f8d8; }
.editor-gate form { display: flex; gap: 8px; flex-wrap: wrap; }
.editor-gate .status.err { color: #fff1ee; background: var(--bad); border-radius: 6px; padding: 2px 8px; }
.editor { display: grid; gap: 16px; position: relative; border-radius: 16px; padding: 46px 12px 12px; background: linear-gradient(var(--olive), var(--olive-dk)); border: 5px solid var(--gold); box-shadow: 0 0 0 2px var(--gold-dk), 0 18px 40px rgba(0,0,0,.55); }
.editor::before {
  content: "Clan Staff Tools"; position: absolute; left: 50%; top: 0; transform: translate(-50%, -55%); white-space: nowrap;
  padding: 6px 26px 8px; border-radius: 999px; border: 3px solid var(--banner-dk); background: linear-gradient(#b6e9fb 0 40%, var(--banner) 40% 100%);
  font-family: var(--font-display); font-size: 24px; color: var(--white); text-shadow: var(--outline);
}
.panel { background: var(--cream); border-radius: 10px; padding: 14px; display: grid; gap: 12px; }
.panel > h2, .panel > .row > h2 { justify-self: start; color: var(--white); text-shadow: 0 2px 0 rgba(0,0,0,.3); background: var(--navy); border-radius: 999px; padding: 2px 16px 4px; font-size: 19px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.drop { background: var(--cyan); border: 3px dashed var(--navy); border-radius: 10px; padding: 20px 16px; text-align: center; display: grid; gap: 8px; justify-items: center; }
.drop.over { background: #c9f0fb; border-color: var(--orange-dk); }
.drop input[type=file] { color: var(--ink); }
.cards { display: grid; gap: 10px; }
.card { display: grid; grid-template-columns: 180px 1fr; gap: 14px; background: var(--cyan); border-radius: 10px; padding: 12px; box-shadow: inset 0 -3px 0 var(--cyan-dk); }
.card img { width: 100%; border-radius: 6px; display: block; border: 2px solid var(--navy); }
.card .thumb { min-width: 0; }
.card .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; min-width: 0; align-content: start; }
.card label { display: grid; gap: 3px; font-size: 12px; font-weight: 700; color: var(--navy); }
.card .status { grid-column: 1 / -1; font-size: 13px; font-weight: 600; }
.card .actions { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; }
.status.err { color: var(--bad); }
.status.ok { color: var(--xp); }
.notes { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; }
.card.compact { grid-template-columns: 56px 1fr auto; align-items: center; padding: 8px 12px; }
.card.compact .thumb img { height: 40px; object-fit: cover; object-position: center 40%; }
.card.compact .line { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; min-width: 0; }
.card.compact .actions { display: flex; gap: 6px; grid-column: auto; }
.card.compact button { padding: 3px 10px; font-size: 14px; }
.card.ready { background: #c7efb0; box-shadow: inset 0 -3px 0 #8fcf6a; }
.card.zoom { grid-template-columns: 1fr; }
.card.zoom .thumb { max-width: none; }
.card .src { font-weight: 500; }
@media (max-width: 560px) { .card { grid-template-columns: 1fr; } .card .thumb { max-width: 220px; } .card.compact { grid-template-columns: 48px 1fr; } .card.compact .actions { grid-column: 1 / -1; } }
.queuebar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 3; background: var(--navy); color: var(--white); border-radius: 10px; padding: 12px 14px; display: grid; gap: 10px; box-shadow: 0 4px 0 rgba(0,0,0,.25); }
.queuebar .muted { color: #cde9f6; }
.queuebar .xp { color: #b6f58a; }
.queuebar .status.err { color: #ffd2c9; }
.qstats { display: flex; flex-wrap: wrap; gap: 4px 18px; }
.warn-t { color: #ffd76a; }
.qprog { height: 14px; border-radius: 99px; background: #0f3554; border: 2px solid #0b2740; overflow: hidden; }
.qprog i { display: block; height: 100%; background: linear-gradient(#8ee85a 0 40%, var(--bar) 40% 100%); border-radius: 99px; transition: width .3s; }
@media (prefers-reduced-motion: reduce) { .qprog i { transition: none; } button:active { transform: none; } }

details.member { border-radius: 8px; background: var(--cyan); box-shadow: inset 0 -3px 0 var(--cyan-dk); }
details.member summary { cursor: pointer; padding: 10px 12px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; color: var(--ink); }
details.member .inner { padding: 0 12px 12px; display: grid; gap: 10px; }
.entries td, .entries th { padding: 6px 8px; font-size: 13px; }
.entries { padding: 0; }

.savebar { position: sticky; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 4; background: var(--orange); color: var(--white); text-shadow: 0 1px 0 var(--orange-dk); border: 3px solid #4aa8dc; border-radius: 12px; padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; font-weight: 700; box-shadow: 0 0 0 2px #1f6f9f, 0 6px 0 rgba(0,0,0,.35); }
.savebar button.primary { background: linear-gradient(#7fe24c 0 45%, #3fae10 45% 100%); border-color: #1f6f9f; box-shadow: inset 0 -3px 0 #2c7e08, 0 3px 0 rgba(0,0,0,.3); }
.savebar button.ghost { background: linear-gradient(#ffe0b0 0 45%, #ffc77a 45% 100%); border-color: var(--orange-dk); }

/* ---------- hotbar countdown ---------- */
.countdown {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; color: var(--white);
  background: linear-gradient(#173a5c, #0e2741); border-top: 3px solid #3c8cc4; box-shadow: 0 -4px 0 rgba(0,0,0,.35);
  padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px));
}
.countdown .in { max-width: 1040px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 16px; }
.countdown .label { font-family: var(--font-display); font-size: 18px; text-shadow: var(--outline); }
.countdown .small { color: #bfe2f5; }
.clock { display: flex; gap: 6px; font-variant-numeric: tabular-nums; }
.clock .slot { display: grid; justify-items: center; min-width: 52px; padding: 2px 6px 3px; border-radius: 8px; background: linear-gradient(#24496c, #163452); border: 2px solid #4f9fd3; box-shadow: inset 0 2px 0 rgba(255,255,255,.12); }
.clock .slot b { font-family: var(--font-display); font-weight: 400; font-size: clamp(20px, 5vw, 26px); line-height: 1.1; color: var(--gold); text-shadow: 0 2px 0 rgba(0,0,0,.5); }
.clock .slot span { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: #bfe2f5; }
</style>

<template id="shell-tpl">
<main class="wrap">
  <section class="window" aria-labelledby="clan-title">
    <h1 class="banner" id="clan-title">Pink Cat <span class="tag">[PINK]</span></h1>
    <div class="window-in">
      <div class="top">
        <p class="sub">Gems donated and XP contributed by every clan member, refreshed from in-game screenshots.</p>
        <label class="period-pick"><span class="pill">Showing</span><select id="period-select"></select></label>
      </div>
      <section class="tiles" id="tiles" aria-label="Clan totals"></section>
      <section class="board" aria-labelledby="board-title">
        <div class="board-head">
          <h2 id="board-title">Clan Members</h2>
          <p class="small" id="board-note"></p>
        </div>
        <div class="scroll"><table id="board"></table></div>
      </section>
    </div>
  </section>

  <section id="editor-root" aria-label="Editor"></section>
</main>
<footer class="countdown" aria-live="off">
  <div class="in">
    <div>
      <p class="label">Clan deadline in</p>
      <p class="small" id="deadline-text"></p>
    </div>
    <div class="clock" id="clock">-</div>
  </div>
</footer>
</template>

<script id="app-script">
(function () {
  const DAY = 864e5;
  let htmlOnly = false;
  let SAVED = JSON.parse(document.getElementById("state").textContent);
  let data = structuredClone(SAVED);
  let dirty = 0;
  let sortKey = "pGems", sortDir = -1;
  let periodIdx = 0;
  let unlocked = false;
  let artifactApi = null, sampleApi = null, sampleImages = false, sampleReady = false, sampleLimits = null;
  let cards = [];
  let cardSeq = 0;

  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmt = (n) => (n == null ? "-" : Math.round(n).toLocaleString("en-US").replace(/,/g, " "));
  const signed = (n) => (n > 0 ? "+" : n < 0 ? "−" : "") + fmt(Math.abs(n));
  const key = (name) => name.trim().toLowerCase();
  const ss = { get(k) { try { return sessionStorage.getItem(k); } catch { return null; } }, set(k, v) { try { sessionStorage.setItem(k, v); } catch {} }, del(k) { try { sessionStorage.removeItem(k); } catch {} } };

  const GEM_SVG = '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M4 2h8l3 4-7 9-7-9z"/><path fill="#0d1820" opacity=".35" d="M1 6h14L8 15z"/></svg>';
  const XP_SVG = '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="currentColor"/><text x="8" y="11.2" text-anchor="middle" font-size="8" font-weight="900" font-family="sans-serif" fill="#0d1820">XP</text></svg>';

  // ---------- periods ----------
  function periodLen() { return data.periodDays * DAY; }
  function currentEnd(now) {
    const a = Date.parse(data.anchor), len = periodLen();
    let k = Math.max(0, Math.ceil((now - a) / len));
    let end = a + k * len;
    if (end <= now) end += len;
    return end;
  }
  function periods(now) {
    const a = Date.parse(data.anchor), len = periodLen();
    const out = [];
    for (let end = currentEnd(now); end >= a; end -= len) out.push({ start: end - len, end, current: out.length === 0 });
    return out;
  }
  const dateFmt = (ms, opts) => new Date(ms).toLocaleString(undefined, opts);
  const shortDate = (ms) => dateFmt(ms, { day: "numeric", month: "short" });

  function stats(m, p) {
    const es = m.entries.slice().sort((x, y) => Date.parse(x.t) - Date.parse(y.t));
    const upTo = es.filter((e) => Date.parse(e.t) < p.end);
    if (!upTo.length) return null;
    const latest = upTo[upTo.length - 1];
    const before = upTo.filter((e) => Date.parse(e.t) < p.start);
    const base = before.length ? before[before.length - 1] : upTo[0];
    const updated = Date.parse(latest.t) >= p.start;
    const baselineOnly = !before.length && latest === base;
    return {
      name: m.name, rank: m.rank, lastT: Date.parse(latest.t), updated, baselineOnly,
      gems: latest.gems, xp: latest.xp,
      pGems: baselineOnly ? null : latest.gems - base.gems,
      pXp: baselineOnly ? null : latest.xp - base.xp,
    };
  }

  // ---------- leaderboard ----------
  function render() {
    const ps = periods(Date.now());
    if (periodIdx >= ps.length) periodIdx = 0;
    const p = ps[periodIdx];
    const sel = $("#period-select");
    sel.innerHTML = ps.map((q, i) => `<option value="${i}">${q.current ? "Current period" : "Past period"}: ${shortDate(q.start)} to ${shortDate(q.end)}</option>`).join("");
    sel.value = String(periodIdx);

    const rows = data.members.map((m) => stats(m, p)).filter(Boolean);
    const sumG = rows.reduce((s, r) => s + (r.pGems || 0), 0);
    const sumX = rows.reduce((s, r) => s + (r.pXp || 0), 0);
    const upd = rows.filter((r) => r.updated).length;
    $("#tiles").innerHTML = `
      <div class="tile"><span class="eyebrow">${GEM_SVG}Gems donated this period</span><span class="big num gem">${fmt(sumG)}</span></div>
      <div class="tile"><span class="eyebrow">${XP_SVG}XP earned this period</span><span class="big num xp">${fmt(sumX)}</span></div>
      <div class="tile"><span class="eyebrow">Members updated this period</span><span class="big num">${upd} <span class="muted" style="font-size:.6em">of ${rows.length}</span></span></div>`;

    const pre = Date.now() < p.start; // before the very first period has begun
    $("#board-note").textContent = (pre
      ? `The first period starts ${dateFmt(p.start, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}. Screenshots added before then are each member's starting point.`
      : `Period gains count from each member's last screenshot before ${shortDate(p.start)}.`) + (dirty ? " Showing unsaved changes." : "");

    const val = (r, k) => (k === "name" ? r.name.toLowerCase() : r[k] ?? -Infinity);
    rows.sort((a, b) => {
      const va = val(a, sortKey), vb = val(b, sortKey);
      return (va < vb ? -1 : va > vb ? 1 : 0) * sortDir || b.xp - a.xp || a.name.localeCompare(b.name);
    });

    const cols = [
      ["name", "Member"], ["pGems", "Gems this period"], ["pXp", "XP this period"],
      ["gems", "Lifetime gems donated"], ["xp", "Lifetime XP contributed"], ["lastT", "Last screenshot"],

    const th = cols.map(([k, label]) => `<th scope="col"><button type="button" data-sort="${k}" ${sortKey === k ? `aria-sort="${sortDir < 0 ? "descending" : "ascending"}"` : ""}>${label}${sortKey === k ? (sortDir < 0 ? " ▾" : " ▴") : ""}</button></th>`).join("");

      $("#board").innerHTML = `<tbody><tr><td colspan="7"><div class="empty"><h3>No members yet</h3><p class="muted">Unlock the editor at the bottom of the page and add a clan member screenshot to start.</p></div></td></tr></tbody>`;

      ? `<td class="num muted" title="Starting point for the first period">start</td>`
      : v == null
      ? `<td class="num muted" title="First screenshot. Gains show from the next one.">new</td>`
      : `<td class="num gain ${v === 0 ? "zero" : cls}">${v === 0 ? "0" : signed(v)}</td>`;
    $("#board").innerHTML = `<thead><tr><th scope="col">#</th>${th}</tr></thead><tbody>` + rows.map((r, i) => `
      <tr>
        <td class="rankno">${i + 1}</td>
        <td><div class="who"><b>${esc(r.name)}</b><span>${r.rank ? `<span class="chip r-${r.rank.toLowerCase().replace(/[^a-z]/g, "")}">${esc(r.rank)}</span>` : ""} ${!r.updated && !pre ? `<span class="chip warn">no update this period</span>` : ""}</span></div></td>
        ${gainCell(r.pGems, "gem", r)}
        ${gainCell(r.pXp, "xp", r)}
        <td class="num">${fmt(r.gems)}</td>
        <td class="num">${fmt(r.xp)}</td>
        <td class="num muted small">${dateFmt(r.lastT, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}</td>
      </tr>`).join("") + "</tbody>";
  }

  // ---------- countdown ----------
  function tick() {
    const now = Date.now();
    const end = currentEnd(now);
    let s = Math.max(0, Math.floor((end - now) / 1000));
    const d = Math.floor(s / 86400); s -= d * 86400;
    const h = Math.floor(s / 3600); s -= h * 3600;
    const m = Math.floor(s / 60); s -= m * 60;
    const p2 = (n) => String(n).padStart(2, "0");
    const slot = (v, unit) => `<div class="slot"><b>${v}</b><span>${unit}</span></div>`;
    $("#clock").innerHTML = slot(d, d === 1 ? "day" : "days") + slot(p2(h), "hrs") + slot(p2(m), "min") + slot(p2(s), "sec");
    const utc = new Date(end).toUTCString().replace(":00 GMT", " UTC");
    $("#deadline-text").textContent = `${utc} · your time: ${dateFmt(end, { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}`;
    if (periods(now).length !== periods(now - 1000).length) render();
  }

  // ---------- editor ----------
  function renderEditor() {
    const root = $("#editor-root");
    if (!unlocked) {
      root.innerHTML = `
        <div class="editor-gate">
          <div style="flex:1 1 240px"><h3>Editor access</h3><p class="small muted">Clan staff can add screenshots and fix numbers here.</p></div>
          <form id="unlock-form" autocomplete="off">
            <input type="password" id="pw" placeholder="Password" aria-label="Editor password">
            <button type="submit">Unlock</button>
          </form>
          <p class="small status err" id="pw-err" hidden>That password is wrong.</p>
        </div>`;
      $("#unlock-form").addEventListener("submit", (e) => {
        e.preventDefault();
        if ($("#pw").value.trim().toLowerCase() === "exp") { unlocked = true; ss.set("pc-unlocked", "1"); renderEditor(); }
        else $("#pw-err").hidden = false;
      });
      return;
    }
    const saveNote = artifactApi ? "" : `<p class="small status err">Saving isn't available in this view. Open the tracker while signed in to claude.ai with edit access to save changes.</p>`;
    const readNote = "Screenshots are read on your device by text recognition, which costs no Claude usage." + (canAskClaude() ? " If one comes out wrong, press Ask Claude on that card." : "");
    root.innerHTML = `
      <div class="editor">
        ${dirty ? `<div class="savebar" role="status"><span>${dirty} unsaved change${dirty > 1 ? "s" : ""}. Everyone sees them once you save.</span><span class="row"><button class="ghost" id="discard-all" type="button">Discard</button><button class="primary" id="save-all" type="button" ${artifactApi ? "" : "disabled"}>Save for everyone</button></span></div>` : ""}
        <div class="panel">
          <div class="row" style="justify-content:space-between"><h2>Add screenshots</h2><button type="button" class="link" id="lock">Lock editor</button></div>
          ${saveNote}
          <label class="drop" id="drop">
            <b>Drop, paste or choose member screenshots</b>
            <span class="small muted">Add as many as you like. They're read one after another.</span>
            <span class="small muted">${readNote}</span>
            <input type="file" id="file" accept="image/*" multiple>
          </label>
          <div class="row"><button type="button" id="manual">Add a member by hand</button></div>
          <div class="queuebar" id="queue-bar" hidden></div>
          <div class="cards" id="cards"></div>
        </div>
        <div class="panel">
          <h2>Members and history</h2>
          <p class="small muted">Every screenshot is kept as a snapshot. Remove a wrong one here or rename a member.</p>
          <div id="members" class="cards"></div>
        </div>
        <div class="panel">
          <h2>Your username</h2>
          <p class="small muted">"Personal Clan Stats" screenshots don't show a name, so they're filed under this member.</p>
          <div class="row">
            <input type="text" id="self-name" list="member-names" value="${esc(data.selfName || "")}" placeholder="Your in-game name" aria-label="Your in-game username">
            <button type="button" id="self-save">Use this name</button>
          </div>
        </div>
        <div class="panel">
          <h2>Deadline</h2>
          <div class="row">
            <label class="small" for="anchor">A deadline (UTC)</label>
            <input type="datetime-local" id="anchor" value="${new Date(data.anchor).toISOString().slice(0, 16)}">
            <label class="small" for="plen">Repeats every</label>
            <input type="number" id="plen" min="1" max="90" value="${data.periodDays}" style="width:80px"><span class="small">days</span>
          </div>
        </div>
      </div>`;
    $("#lock").onclick = () => { unlocked = false; ss.del("pc-unlocked"); renderEditor(); };
    $("#manual").onclick = () => { addCard(null); };
    $("#file").onchange = (e) => { addFiles(e.target.files); e.target.value = ""; };
    const drop = $("#drop");
    drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
    drop.addEventListener("dragleave", () => drop.classList.remove("over"));
    drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("over"); addFiles(e.dataTransfer.files); });
    $("#anchor").onchange = (e) => { const v = Date.parse(e.target.value + ":00Z"); if (!isNaN(v)) { data.anchor = new Date(v).toISOString(); change(); } };
    $("#self-save").onclick = () => {
      const v = $("#self-name").value.trim();
      if (v === (data.selfName || "")) return;
      data.selfName = v;
      cards.filter((c) => c.personal && !c.name.trim()).forEach((c) => { c.name = v; c.problems = c.problems.filter((t) => !t.includes("username")); });
      change();
    };
    $("#plen").onchange = (e) => { const v = parseInt(e.target.value, 10); if (v >= 1 && v <= 90) { data.periodDays = v; change(); } };
    if (dirty) {
      $("#save-all").onclick = save;
      $("#discard-all").onclick = () => { data = structuredClone(SAVED); dirty = 0; render(); renderEditor(); };
    }
    renderCards();
    renderMembers();
  }

  function change() { dirty++; render(); renderEditor(); }

  // ---------- reading a member popup (kept in sync with the offline test script) ----------
  // Reads a Pixel Worlds clan member popup ("member info" or "Personal Clan Stats").
  // Works on {data,width,height} RGBA images; recognize(image, {psm, whitelist}) runs Tesseract.
  //
  // 1. Find the column of four white value boxes (Rank, Age, donated, contributed) by shape.
  // 2. Read each box from a tight, cleaned-up crop, several times at different sizes, and vote.
  // 3. Read the banner above the boxes: a username, or "Personal Clan Stats" for your own stats.
  // If the boxes can't be found, fall back to finding the "donated"/"contributed" words on the page.

  function resample(img, scale) {
    const W = Math.max(1, Math.round(img.width * scale)), H = Math.max(1, Math.round(img.height * scale));
    const out = new Uint8ClampedArray(W * H * 4), s = img.data, iw = img.width;
    for (let y = 0; y < H; y++) {
      const fy = Math.max(0, (y + 0.5) / scale - 0.5), iy = Math.min(img.height - 2, Math.floor(fy)), ay = Math.min(1, fy - iy);
      for (let x = 0; x < W; x++) {
        const fx = Math.max(0, (x + 0.5) / scale - 0.5), ix = Math.min(iw - 2, Math.floor(fx)), ax = Math.min(1, fx - ix);
        const p00 = (iy * iw + ix) * 4, p10 = p00 + 4, p01 = p00 + iw * 4, p11 = p01 + 4, o = (y * W + x) * 4;
        for (let c = 0; c < 4; c++) out[o + c] = (s[p00 + c] * (1 - ax) + s[p10 + c] * ax) * (1 - ay) + (s[p01 + c] * (1 - ax) + s[p11 + c] * ax) * ay;
      }
    }
    return { data: out, width: W, height: H };
  }

  function sub(img, r) {
    const x0 = Math.max(0, Math.round(r.x0)), y0 = Math.max(0, Math.round(r.y0));
    const x1 = Math.min(img.width, Math.round(r.x1)), y1 = Math.min(img.height, Math.round(r.y1));
    const w = Math.max(2, x1 - x0), h = Math.max(2, y1 - y0), out = new Uint8ClampedArray(w * h * 4);
    for (let y = 0; y < h; y++) {
      const sy = Math.min(img.height - 1, y0 + y);
      out.set(img.data.subarray((sy * img.width + x0) * 4, (sy * img.width + Math.min(img.width, x0 + w)) * 4), y * w * 4);
    }
    return { data: out, width: w, height: h };
  }

  // Black text on white, padded. mode "dark": dark ink on a light box (Otsu threshold).
  // mode "light": white ink on a coloured banner (fixed cutoff `cut`).
  function binarize(img, mode, cut, thin) {
    const n = img.width * img.height, g = new Uint8Array(n);
    for (let i = 0, p = 0; i < n; i++, p += 4) {
      const r = img.data[p], gg = img.data[p + 1], b = img.data[p + 2];
      g[i] = mode === "light" ? Math.min(r, gg, b) : Math.round(r * 0.3 + gg * 0.59 + b * 0.11);
    }
    let t = cut;
    if (mode === "dark") {
      const hist = new Array(256).fill(0);
      for (let i = 0; i < n; i++) hist[g[i]]++;
      let sum = 0; for (let i = 0; i < 256; i++) sum += i * hist[i];
      let sB = 0, wB = 0, best = -1; t = 128;
      for (let i = 0; i < 256; i++) {
        wB += hist[i]; if (!wB) continue;
        const wF = n - wB; if (!wF) break;
        sB += i * hist[i];
        const mB = sB / wB, mF = (sum - sB) / wF, v = wB * wF * (mB - mF) * (mB - mF);
        if (v > best) { best = v; t = i; }
      }
      t = Math.min(t, 200) - (thin || 0);
    }
    const P = Math.max(10, Math.round(img.height * 0.25)), W = img.width + 2 * P, H = img.height + 2 * P;
    const out = new Uint8ClampedArray(W * H * 4).fill(255);
    for (let y = 0; y < img.height; y++) for (let x = 0; x < img.width; x++) {
      const v = g[y * img.width + x], ink = mode === "light" ? v > t : v <= t;
      if (ink) { const o = ((y + P) * W + x + P) * 4; out[o] = out[o + 1] = out[o + 2] = 0; }
    }
    return { data: out, width: W, height: H };
  }

  // Connected white regions shaped like the value boxes.
  // Tries a few whiteness cutoffs, starting just under the brightest white in the picture, so dim or
  // over-compressed screenshots still work and boxes that sit close together don't melt into one.
  function findValueBoxes(img) {
    const scale = Math.min(1, 1600 / img.width);
    const im = scale < 1 ? resample(img, scale) : img;
    const d = im.data, N = im.width * im.height, hist = new Uint32Array(256);
    for (let p = 0; p < N * 4; p += 4) {
      const mn = Math.min(d[p], d[p + 1], d[p + 2]), mx = Math.max(d[p], d[p + 1], d[p + 2]);
      if (mx - mn < 24) hist[mn]++;
    }
    let acc = 0, peak = 255;
    for (let v = 255; v >= 0; v--) { acc += hist[v]; if (acc >= N * 0.004) { peak = v; break; } }
    const tried = new Set();
    for (const cut of [peak - 14, 240, 222, peak - 32, peak - 50, 200]) {
      const c = Math.max(120, Math.min(250, Math.round(cut)));
      if (tried.has(c)) continue;
      tried.add(c);
      const found = boxesAt(im, c);
      if (found) return found.map((b) => ({ x0: b.x0 / scale, x1: b.x1 / scale, y0: b.y0 / scale, y1: b.y1 / scale, w: b.w / scale, h: b.h / scale }));
    }
    return null;
  }
  function boxesAt(im, cut) {
    const W = im.width, H = im.height, d = im.data, N = W * H;
    const mask = new Uint8Array(N);
    for (let i = 0, p = 0; i < N; i++, p += 4) {
      const mn = Math.min(d[p], d[p + 1], d[p + 2]), mx = Math.max(d[p], d[p + 1], d[p + 2]);
      mask[i] = mn > cut && mx - mn < 24 ? 1 : 0;
    }
    const seen = new Uint8Array(N), stack = new Int32Array(N), comps = [];
    for (let s = 0; s < N; s++) {
      if (!mask[s] || seen[s]) continue;
      let top = 0, count = 0, x0 = W, x1 = 0, y0 = H, y1 = 0;
      stack[top++] = s; seen[s] = 1;
      while (top) {
        const i = stack[--top], x = i % W, y = (i - x) / W;
        count++; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
        if (x > 0 && mask[i - 1] && !seen[i - 1]) { seen[i - 1] = 1; stack[top++] = i - 1; }
        if (x < W - 1 && mask[i + 1] && !seen[i + 1]) { seen[i + 1] = 1; stack[top++] = i + 1; }
        if (y > 0 && mask[i - W] && !seen[i - W]) { seen[i - W] = 1; stack[top++] = i - W; }
        if (y < H - 1 && mask[i + W] && !seen[i + W]) { seen[i + W] = 1; stack[top++] = i + W; }
      }
      const w = x1 - x0 + 1, h = y1 - y0 + 1;
      if (h >= 8 && w >= 30 && w / h >= 2.5 && w / h <= 10 && count / (w * h) >= 0.55) comps.push({ x0, x1: x1 + 1, y0, y1: y1 + 1, w, h });
    }
    // Four boxes in one column, same width and height, evenly spaced.
    comps.sort((a, b) => a.y0 - b.y0);
    let found = null;
    for (const a of comps) {
      // Left edges line up; a box's right part can be cut off where its text touches the border.
      const col = comps.filter((c) => Math.abs(c.x0 - a.x0) <= Math.max(3, a.h * 0.3) && c.w >= a.w * 0.45 && c.w <= a.w * 2.2 && Math.abs(c.h - a.h) <= a.h * 0.3 && c.y0 >= a.y0);
      if (col.length < 4) continue;
      const g = col[1].y0 - col[0].y0;
      if (g < a.h || g > a.h * 2.2) continue;
      if ([2, 3].every((k) => Math.abs(col[k].y0 - col[k - 1].y0 - g) <= g * 0.2)) { found = col.slice(0, 4); break; }
    }
    if (found) {
      const x1 = Math.max(...found.map((b) => b.x1));
      found = found.map((b) => ({ ...b, x1, w: x1 - b.x0 }));
    }
    return found;
  }

  const digitsOf = (s) => (s || "").replace(/[Oo]/g, "0").replace(/[Il|]/g, "1").replace(/\D/g, "");
  function lev(a, b) {
    const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
    for (let j = 1; j <= b.length; j++) d[0][j] = j;
    for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    return d[a.length][b.length];
  }
  function closest(s, list, maxRatio) {
    let best = null, bd = Infinity;
    for (const c of list) { const dd = lev(s.toLowerCase(), c.toLowerCase()); if (dd < bd) { bd = dd; best = c; } }
    return best && bd <= Math.max(1, Math.floor(best.length * maxRatio)) ? best : null;
  }
  const RANKS = ["Leader", "Co-Leader", "Elder", "Veteran", "Member", "Recruit"];

  // Inside a box, the text sits right-aligned; trim the box border before reading.
  function inner(b) { const m = Math.max(2, b.h * 0.12); return { x0: b.x0 + m, x1: b.x1 - m, y0: b.y0 + m, y1: b.y1 - m }; }

  async function readNumber(img, box, recognize) {
    const r = inner(box), base = sub(img, r);
    // The game groups digits in threes ("1 573 330"). Tesseract often drops the spaces, so the groups are
    // measured from the pixels instead, giving the digit count every read has to match.
    const reads = [], tally = {};
    let expected = null; // {min, max} digits
    // Each size is also read with thinner strokes, which keeps blurred digits like "33" apart.
    for (const [target, thin] of [[48, 0], [48, 40], [34, 0], [64, 40], [64, 0], [40, 40], [56, 0], [34, 40]]) {
      const im = binarize(resample(base, target / base.height), "dark", 0, thin);
      if (expected === null) expected = digitCount(im);
      const t = await recognize(im, { psm: 7, whitelist: "0123456789 " });
      const v = digitsOf(t.text);
      const fits = v.length >= expected.min && v.length <= expected.max;
      reads.push({ v, fits });
      if (fits) tally[v] = (tally[v] || 0) + 1;
      const ranked = Object.entries(tally).sort((x, y) => y[1] - x[1]);
      // Stop early once three reads agree and none disagree; otherwise read at every size.
      if (ranked.length === 1 && ranked[0][1] >= 3) return { value: ranked[0][0], sure: true };
    }
    const ranked = Object.entries(tally).sort((x, y) => y[1] - x[1]);
    if (ranked.length && ranked[0][1] >= 3 && ranked[0][1] >= 3 * (ranked[1] ? ranked[1][1] : 0)) return { value: ranked[0][0], sure: true };
    // No clear winner: offer the most common read and ask for a check.
    return { value: ranked.length ? ranked[0][0] : (reads.find((r) => r.v) || { v: "" }).v, sure: false };
  }

  // Range of digit counts implied by the spacing of ink in a binarized number box.
  function digitCount(im) {
    const W = im.width, H = im.height, col = new Uint16Array(W);
    let top = H, bottom = 0;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (im.data[(y * W + x) * 4] === 0) { col[x]++; if (y < top) top = y; if (y > bottom) bottom = y; }
    const th = bottom - top + 1;
    const unknown = { min: 1, max: 15 };
    if (th < 4) return unknown;
    const runs = [];
    let cur = null;
    for (let x = 0; x < W; x++) {
      if (col[x] > 0) { if (!cur) cur = { x0: x, x1: x }; cur.x1 = x; }
      else if (cur) { runs.push(cur); cur = null; }
    }
    if (cur) runs.push(cur);
    if (!runs.length) return unknown;
    const groups = [{ x0: runs[0].x0, x1: runs[0].x1 }];
    for (let i = 1; i < runs.length; i++) {
      const g = groups[groups.length - 1];
      if (runs[i].x0 - g.x1 > th * 0.28) groups.push({ x0: runs[i].x0, x1: runs[i].x1 }); else g.x1 = runs[i].x1;
    }
    if (groups.length < 2) return groups[0].x1 - groups[0].x0 + 1 < th * 2.3 ? { min: 1, max: 3 } : unknown;
    // Groups after the first hold 3 digits each; a narrow "1" makes widths vary, so only the first group's size is estimated.
    const later = groups.slice(1).map((g) => g.x1 - g.x0 + 1).sort((a, b) => a - b);
    const w3 = later[later.length - 1];
    const k = Math.max(1, Math.min(3, Math.round((groups[0].x1 - groups[0].x0 + 1) / (w3 / 3))));
    const n = 3 * (groups.length - 1);
    return later.every((w) => w > w3 * 0.55) ? { min: n + Math.max(1, k - 1), max: n + Math.min(3, k + 1) } : unknown;
  }

  async function readWords(img, r, mode, recognize, targetH, whitelist, cut) {
    const base = sub(img, r);
    const im = binarize(resample(base, targetH / base.height), mode, cut);
    return recognize(im, { psm: 7, whitelist });
  }

  // The band of rows holding the most white text inside a search area.
  function textBand(img, r, rowH) {
    const b = sub(img, r), rows = [];
    for (let y = 0; y < b.height; y++) {
      let n = 0;
      for (let x = 0; x < b.width; x++) { const p = (y * b.width + x) * 4; if (Math.min(b.data[p], b.data[p + 1], b.data[p + 2]) > 215) n++; }
      rows.push(n);
    }
    const gap = Math.max(2, Math.round(rowH * 0.15));
    let best = null, cur = null, quiet = 0;
    rows.forEach((n, y) => {
      if (n >= 2) { if (!cur) cur = { y0: y, y1: y, ink: 0 }; cur.y1 = y; cur.ink += n; quiet = 0; }
      else if (cur && ++quiet > gap) { if (!best || cur.ink > best.ink) best = cur; cur = null; quiet = 0; }
    });
    if (cur && (!best || cur.ink > best.ink)) best = cur;
    if (!best) return r;
    const pad = rowH * 0.2;
    return { x0: r.x0, x1: r.x1, y0: Math.max(r.y0, r.y0 + best.y0 - pad), y1: Math.min(r.y1, r.y0 + best.y1 + pad) };
  }

  const NAME_CHARS = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_-. ";
  async function readBanner(img, rankBox, recognize, knownNames) {
    const h = rankBox.h, cx = rankBox.x1, half = rankBox.w * 1.45;
    const area = { x0: cx - half, x1: cx + half, y0: rankBox.y0 - h * 4.6, y1: rankBox.y0 - h * 1.1 };
    const band = textBand(img, area, h);
    let best = null;
    for (const cut of [215, 235, 195]) {
      const t = await readWords(img, band, "light", recognize, 56, NAME_CHARS, cut);
      const text = t.text.replace(/\s+/g, " ").trim();
      if (!best || t.confidence > best.confidence) best = { text, confidence: t.confidence };
      if (t.confidence >= 90) break;
    }
    const flat = best.text.replace(/\s+/g, "");
    if (/personal|clanstat/i.test(flat) || lev(flat.toLowerCase(), "personalclanstats") <= 4) return { personal: true };
    const raw = flat.replace(/[^\w.\-]/g, "");
    const known = knownNames || [];
    const snap = closest(raw, known, 0.25)
      || known.filter((k) => k.length >= 4 && raw.toLowerCase().includes(k.toLowerCase())).sort((a, b) => b.length - a.length)[0] || null;
    return { name: snap || raw, sure: !!snap || (best.confidence >= 85 && raw.length > 0), known: !!snap };
  }

  async function readMemberShot(img, recognize, knownNames) {
    if (img.width < 1600) img = resample(img, 1600 / img.width); // small screenshots: enlarge first
    const boxes = findValueBoxes(img);
    if (!boxes) return readByLabels(img, recognize, knownNames);
    const [rankB, , gemsB, xpB] = boxes;
    const res = { ok: true, problems: [], method: "boxes" };
    const g = await readNumber(img, gemsB, recognize), x = await readNumber(img, xpB, recognize);
    res.gems = g.value; res.xp = x.value;
    if (!g.sure) res.problems.push("Check the gems number");
    if (!x.sure) res.problems.push("Check the XP number");
    const rk = await readWords(img, inner(rankB), "dark", recognize, 48, "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz-");
    const words = rk.text.split(/\s+/).filter((t) => t.length > 2);
    let hit = null;
    for (const t of words.slice().reverse()) { hit = closest(t, RANKS, 0.45); if (hit) break; }
    res.rank = hit || words.slice(-1)[0] || "";
    const ban = await readBanner(img, rankB, recognize, knownNames);
    if (ban.personal) { res.personal = true; res.name = ""; }
    else { res.name = ban.name; if (!ban.sure) res.problems.push("Check the username"); }
    return res;
  }

  // Fallback: find the "donated" / "contributed" words on the whole screenshot.
  async function readByLabels(img, recognize, knownNames) {
    const full = await recognize(img, { psm: 3 });
    const lines = full.lines;
    const find = (re) => lines.find((l) => re.test(l.text));
    const don = find(/d[o0]n[a-z]{2}ed|donat/i), con = find(/c[o0]ntr[a-z]{2,4}ted|contrib/i), rank = find(/\bRank\b|Rank:/i);
    if (!don || !con) return { ok: false, why: "Couldn't find the donated and contributed boxes. Is this a clan member or Personal Clan Stats popup?" };
    const rowH = Math.max(12, con.bbox.y0 - don.bbox.y0);
    // Boxes sit to the right of the labels; build them from the number words' extents.
    const numBox = (line) => {
      const ws = (line.words || []).filter((w) => /\d/.test(w.text));
      if (!ws.length) return null;
      const x1 = Math.max(...ws.map((w) => w.bbox.x1)) + rowH * 0.3;
      return { x0: x1 - rowH * 5.2, x1, y0: line.bbox.y0 - rowH * 0.25, y1: line.bbox.y0 + rowH * 0.8, w: rowH * 5.2, h: rowH * 1.05 };
    };
    const gb = numBox(don), xb = numBox(con);
    const res = { ok: true, problems: [], method: "labels" };
    const g = gb ? await readNumber(img, gb, recognize) : { value: "", sure: false };
    const x = xb ? await readNumber(img, xb, recognize) : { value: "", sure: false };
    res.gems = g.value; res.xp = x.value;
    if (!g.sure) res.problems.push("Check the gems number");
    if (!x.sure) res.problems.push("Check the XP number");
    const ref = gb || xb;
    if (ref) {
      const rankB = { x0: ref.x0, x1: ref.x1, w: ref.w, h: ref.h, y0: (rank ? rank.bbox.y0 : don.bbox.y0 - rowH * 2) - rowH * 0.25, y1: 0 };
      rankB.y1 = rankB.y0 + ref.h;
      const rk = await readWords(img, inner(rankB), "dark", recognize, 48, "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz-");
      const words = rk.text.split(/\s+/).filter((t) => t.length > 2);
      let hit = null;
      for (const t of words.slice().reverse()) { hit = closest(t, RANKS, 0.45); if (hit) break; }
      res.rank = hit || "";
      const ban = await readBanner(img, rankB, recognize, knownNames);
      if (ban.personal) { res.personal = true; res.name = ""; }
      else { res.name = ban.name; if (!ban.sure) res.problems.push("Check the username"); }
    } else { res.rank = ""; res.name = ""; res.problems.push("Check the username"); }
    return res;
  }


  // ---------- screenshot queue ----------
  // Each screenshot becomes a card: queued -> reading -> done | failed. Manual cards start as "manual".
  // Screenshots are read on this device with Tesseract; Claude is only asked when someone presses "Ask Claude".
  let paused = false, pauseMsg = "";

  function addFiles(list) {
    const files = [...list].filter((f) => f.type.startsWith("image/"));
    files.forEach((f) => addCard(f));
    pump();
  }
  function addCard(file) {
    const c = { id: ++cardSeq, file, url: file ? URL.createObjectURL(file) : null, name: "", rank: "", gems: "", xp: "", problems: [],
      when: localInput(Date.now()), whenSrc: file ? "time added" : "", status: file ? "queued" : "manual", msg: "", open: !file, el: null };
    cards.push(c);
    if (file) guessDate(file).then((d) => { c.when = localInput(d.ms); c.whenSrc = d.src; drawCard(c); });
    mountCard(c);
    drawSummary();
    return c;
  }
  function localInput(ms) { const d = new Date(ms); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); }

  function pump() {
    if (ocrState === "failed") {
      cards.filter((c) => c.status === "queued").forEach((c) => fail(c, "Text recognition couldn't start here. Type the numbers" + (canAskClaude() ? ", or press Ask Claude." : ".")));
      return drawSummary();
    }
    if (!paused && !cards.some((c) => c.status === "reading")) {
      const c = cards.find((x) => x.status === "queued");
      if (c) readShot(c);
    }
    drawSummary();
  }
  function fail(c, msg) { c.status = "failed"; c.msg = msg; c.open = true; drawCard(c); }

  // ---------- local text recognition ----------
  const TESS = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/";
  let ocrWorker = null, ocrState = "idle", ocrPromise = null;
  function loadScript(src) {
    return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("load " + src)); document.head.append(s); });
  }
  function ocrInit() {
    if (!ocrPromise) {
      ocrState = "loading"; drawSummary();
      const start = (async () => {
        if (!window.Tesseract) await loadScript(TESS + "tesseract.min.js");
        // The English language data is published next to this page (as .wasm, a type artifacts serve).
        // The page downloads it and the worker's request for it is pointed at that copy.
        const resp = await fetch("eng-traineddata.wasm");
        if (!resp.ok) throw new Error("language data " + resp.status);
        const langUrl = URL.createObjectURL(new Blob([await resp.arrayBuffer()]));
        const boot = `const real = self.fetch.bind(self);
self.fetch = (u, o) => (/eng\\.traineddata/.test(String(u)) ? real(${JSON.stringify(langUrl)}, o) : real(u, o));
importScripts(${JSON.stringify(TESS + "worker.min.js")});`;
        const workerPath = URL.createObjectURL(new Blob([boot], { type: "application/javascript" }));
        return Tesseract.createWorker("eng", 1, { workerPath, workerBlobURL: false, corePath: "https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1",
          langPath: "https://lang.invalid", gzip: true, cacheMethod: "none" });
      })();
      const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 90e3));
      ocrPromise = Promise.race([start, timeout]).then((w) => { ocrWorker = w; ocrState = "ready"; drawSummary(); return w; },
        (e) => { console.warn("Text recognition failed to start", e); ocrState = "failed"; pump(); throw e; });
    }
    return ocrPromise;
  }
  function toCanvas(im) {
    const cv = document.createElement("canvas");
    cv.width = im.width; cv.height = im.height;
    cv.getContext("2d").putImageData(new ImageData(im.data, im.width, im.height), 0, 0);
    return cv;
  }
  async function ocrRecognize(im, o) {
    await ocrWorker.setParameters({ tessedit_pageseg_mode: String(o.psm), tessedit_char_whitelist: o.whitelist || "" });
    const r = (await ocrWorker.recognize(toCanvas(im))).data;
    return { text: r.text || "", confidence: r.confidence || 0,
      lines: (r.lines || []).map((l) => ({ text: l.text, bbox: l.bbox, words: (l.words || []).map((w) => ({ text: w.text, bbox: w.bbox })) })) };
  }
  async function fileRGBA(file) {
    const bmp = await createImageBitmap(file);
    const cv = document.createElement("canvas");
    cv.width = bmp.width; cv.height = bmp.height;
    const g = cv.getContext("2d");
    g.drawImage(bmp, 0, 0);
    return g.getImageData(0, 0, cv.width, cv.height);
  }

  function applyRead(c, r) {
    c.name = r.name || ""; c.rank = r.rank || ""; c.gems = r.gems || ""; c.xp = r.xp || "";
    const existing = data.members.find((m) => key(m.name) === key(c.name));
    if (existing) c.name = existing.name;
  }

  async function readShot(c) {
    c.status = "reading"; drawCard(c);
    try {
      await ocrInit();
      const r = await readMemberShot(await fileRGBA(c.file), ocrRecognize, data.members.map((m) => m.name));
      if (!r.ok) { fail(c, r.why + (canAskClaude() ? " You can type the numbers or press Ask Claude." : " Type the numbers instead.")); }
      else {
        applyRead(c, r);
        c.problems = r.problems;
        c.personal = !!r.personal;
        if (r.personal) {
          c.name = data.selfName || "";
          if (!c.name) c.problems.push("Personal stats: type your username");
        }
        c.status = "done"; c.msg = "";
        c.open = issues(c).block.length > 0;
        drawCard(c);
        redrawSameName(c);
      }
    } catch (e) {
      if (ocrState !== "failed") fail(c, "This screenshot couldn't be read. Type the numbers" + (canAskClaude() ? ", or press Ask Claude." : "."));
    }
    pump();
  }

  // ---------- Claude fallback (one card at a time, only on request) ----------
  const canAskClaude = () => !!(sampleApi && sampleImages);
  const PROMPT = `This is a screenshot from the game Pixel Worlds showing a clan member's info popup.
The member's username is in the blue banner at the top of the popup. Below it are rows for Rank, Age, "donated" (next to a gem/diamond icon) and "contributed" (next to an XP icon).
Numbers use spaces as thousand separators, e.g. "1 573 330" means 1573330.
If the banner says "Personal Clan Stats" instead of a name, it's the player's own stats: set username to null and personal to true.
Reply with only this JSON: {"username": string|null, "personal": boolean, "rank": string|null, "gems": integer|null, "xp": integer|null}
gems = the donated number, xp = the contributed number. Copy the username exactly as shown. Use null for anything you cannot read clearly, and all nulls if this is not a clan member popup.`;

  async function fitImage(file) {
    const lim = sampleLimits && sampleLimits.images;
    if (lim && file.size <= lim.maxInputBytes && lim.mediaTypes.includes(file.type)) return file;
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
    const cv = document.createElement("canvas");
    cv.width = Math.round(bmp.width * scale); cv.height = Math.round(bmp.height * scale);
    cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
    return await new Promise((res) => cv.toBlob(res, "image/jpeg", 0.9));
  }

  async function askClaude(c) {
    const prev = c.status;
    c.status = "asking"; drawCard(c);
    try {
      const r = await sampleApi.json(PROMPT, { images: [await fitImage(c.file)], cache: false, modelTier: "quick" });
      const toInt = (v) => (v == null ? "" : String(v).replace(/\D/g, ""));
      applyRead(c, { name: r && r.username ? String(r.username).trim() : "", rank: r && r.rank ? String(r.rank).trim() : "", gems: toInt(r && r.gems), xp: toInt(r && r.xp) });
      c.problems = [];
      c.personal = !!(r && r.personal);
      if (c.personal) c.name = data.selfName || "";
      c.status = "done";
      c.msg = c.name || c.gems || c.xp ? "Read by Claude. Check it against the image, then add it." : "Claude says this doesn't look like a clan member popup.";
      c.open = true;
    } catch (e) {
      const code = e && e.code;
      if (code === "not_granted" || code === "sampling_disabled" || code === "images_unavailable" || code === "not_declared") sampleImages = false;
      c.status = prev === "asking" ? "failed" : prev;
      c.msg = {
        rate_limited: "Claude's usage limit was reached. Try again in a few minutes, or type the numbers.",
        not_granted: "Claude wasn't allowed to read screenshots here. Type the numbers instead.",
        image_rejected: "That image couldn't be sent. Try a PNG or JPG screenshot.",
        refused: "Claude couldn't read this image. Type the numbers instead.",
        session_expired: "Your claude.ai sign-in expired. Sign in again, then try once more.",
      }[code] || "Claude couldn't read it this time. Type the numbers, or try again later.";
    }
    drawCard(c); drawSummary();
  }

  // Problems that keep a card out of "Add all ready" (block) and things worth a glance (info).
  function issues(c) {
    const block = [...(c.problems || [])], info = [];
    if (!c.name.trim()) block.push("Username missing");
    if (c.gems === "") block.push("Gems missing");
    if (c.xp === "") block.push("XP missing");
    if (isNaN(Date.parse(c.when))) block.push("Date missing");
    const m = data.members.find((x) => key(x.name) === key(c.name));
    if (c.personal) info.push("Personal Clan Stats");
    if (c.name.trim() && !m) info.push("New member");
    if (m && m.entries.length) {
      const last = m.entries.slice().sort((a, b) => Date.parse(a.t) - Date.parse(b.t)).pop();
      if (c.gems !== "" && +c.gems < last.gems) block.push(`Gems lower than last time (${fmt(last.gems)})`);
      if (c.xp !== "" && +c.xp < last.xp) block.push(`XP lower than last time (${fmt(last.xp)})`);
      if (+c.gems === last.gems && +c.xp === last.xp) info.push("Same numbers as last screenshot");
    }
    const settled = (o) => o.status === "done" || o.status === "manual" || o.status === "failed";
    const twin = cards.find((o) => o !== c && o.name && key(o.name) === key(c.name) && settled(o));
    const earlierSame = cards.find((o) => cards.indexOf(o) < cards.indexOf(c) && o.name && key(o.name) === key(c.name) && settled(o) && o.gems === c.gems && o.xp === c.xp);
    if (c.name.trim() && twin) {
      if (earlierSame) block.push("Duplicate of an earlier screenshot in the queue");
      else if (twin.gems === c.gems && twin.xp === c.xp) info.push("Has a duplicate later in the queue");
      else info.push("This member appears twice in the queue");
    }
    return { block, info };
  }
  const isReady = (c) => c.status === "done" && issues(c).block.length === 0;

  function mountCard(c) {
    c.el = document.createElement("div");
    const box = $("#cards");
    if (box) box.append(c.el);
    drawCard(c);
  }

  function drawCard(c) {
    if (!c.el) return;
    const iss = issues(c);
    const busy = c.status === "queued" || c.status === "reading" || c.status === "asking";
    const thumb = c.url ? `<img src="${c.url}" alt="Screenshot ${c.id}">` : `<p class="small muted">Typed in</p>`;
    if (busy) {
      c.el.className = "card compact";
      c.el.innerHTML = `<div class="thumb">${thumb}</div><p class="small muted">${c.status === "reading" ? (ocrState === "loading" ? "Loading text recognition…" : "Reading screenshot…") : c.status === "asking" ? "Asking Claude…" : "Waiting in queue"}</p><div class="actions"><button type="button" data-act="drop">Remove</button></div>`;
    } else if (!c.open && isReady(c)) {
      c.el.className = "card compact ready";
      c.el.innerHTML = `<div class="thumb">${thumb}</div>
        <div class="line"><b>${esc(c.name)}</b>${c.rank ? ` <span class="chip">${esc(c.rank)}</span>` : ""}
          <span class="num gem">${GEM_SVG}${fmt(+c.gems)}</span><span class="num xp">${XP_SVG}${fmt(+c.xp)}</span>
          <span class="small muted">${esc(c.when.replace("T", " "))}</span>${iss.info.map((t) => `<span class="chip">${esc(t)}</span>`).join("")}</div>
        <div class="actions"><button type="button" data-act="open">Check</button><button type="button" data-act="drop">Remove</button></div>`;
    } else {
      const tone = c.status === "failed" ? "err" : iss.block.length ? "" : "ok";
      const text = c.msg || (c.status === "manual" ? "Type the member's numbers from the game." : iss.block.length ? "Check the highlighted problems against the screenshot." : "Read from the screenshot. Check it against the image, then add it.");
      c.el.className = "card";
      c.el.innerHTML = `
        <div class="thumb">${c.url ? `<a href="#" data-act="zoom" title="Show full size">${thumb}</a>` : thumb}</div>
        <div class="fields">
          <p class="status ${tone}">${esc(text)}</p>
          <label>Username<input type="text" id="c${c.id}-name" data-f="name" list="member-names" value="${esc(c.name)}"></label>
          <label>Rank<input type="text" id="c${c.id}-rank" data-f="rank" value="${esc(c.rank)}" placeholder="Leader, Elder…"></label>
          <label><span>${GEM_SVG}Gems donated (lifetime)</span><input type="text" inputmode="numeric" id="c${c.id}-gems" data-f="gems" value="${esc(c.gems)}"></label>
          <label><span>${XP_SVG}XP contributed (lifetime)</span><input type="text" inputmode="numeric" id="c${c.id}-xp" data-f="xp" value="${esc(c.xp)}"></label>
          <label><span>Screenshot taken${c.whenSrc ? ` <span class="src">(from ${esc(c.whenSrc)})</span>` : ""}</span><input type="datetime-local" id="c${c.id}-when" data-f="when" value="${esc(c.when)}"></label>
          <div class="notes">${notesHtml(iss)}</div>
          <div class="actions"><button type="button" class="primary" data-act="add">Add to tracker</button>${c.file && c.status === "failed" && ocrState === "ready" ? `<button type="button" data-act="retry">Read again</button>` : ""}${c.file && canAskClaude() ? `<button type="button" data-act="claude" title="Uses your Claude usage for this one screenshot">Ask Claude</button>` : ""}<button type="button" data-act="drop">Remove</button></div>
        </div>`;
      c.el.querySelectorAll("[data-f]").forEach((inp) => {
        inp.addEventListener("input", () => {
          let v = inp.value;
          if (inp.dataset.f === "gems" || inp.dataset.f === "xp") { v = v.replace(/\D/g, ""); if (v !== inp.value) inp.value = v; }
          c[inp.dataset.f] = v;
          if (inp.dataset.f === "when") c.whenSrc = "";
          const word = { name: "username", gems: "gems", xp: "XP" }[inp.dataset.f];
          if (word) c.problems = (c.problems || []).filter((t) => !t.includes(word));
          c.el.querySelector(".notes").innerHTML = notesHtml(issues(c));
          drawSummary();
        });
      });
    }
    c.el.querySelectorAll("[data-act]").forEach((b) => b.addEventListener("click", (e) => {
      const act = b.dataset.act;
      if (act === "zoom") { e.preventDefault(); c.el.classList.toggle("zoom"); return; }
      if (act === "drop") { dropCard(c); pump(); return; }
      if (act === "open") { c.open = true; drawCard(c); return; }
      if (act === "retry") { c.status = "queued"; c.msg = ""; drawCard(c); pump(); return; }
      if (act === "claude") { askClaude(c); return; }
      if (act === "add") {
        const bl = issues(c).block.filter((t) => /missing/.test(t));
        if (bl.length) { const st = c.el.querySelector(".status"); st.className = "status err"; st.textContent = "Fill in the username, gems, XP and date before adding."; return; }
        commitCards([c]);
      }
    }));
  }
  function redrawSameName(c) {
    cards.forEach((o) => {
      if (o === c || !o.name || key(o.name) !== key(c.name)) return;
      if (!o.open || !o.el.querySelector(".notes")) drawCard(o);
      else o.el.querySelector(".notes").innerHTML = notesHtml(issues(o));
    });
  }
  function notesHtml(iss) {
    return iss.block.map((t) => `<span class="chip warn">${esc(t)}</span>`).join("") + iss.info.map((t) => `<span class="chip">${esc(t)}</span>`).join("");
  }

  function drawSummary() {
    const bar = $("#queue-bar");
    if (!bar) return;
    if (!cards.length) { bar.hidden = true; return; }
    bar.hidden = false;
    const n = (s) => cards.filter((c) => c.status === s).length;
    const waiting = n("queued"), reading = n("reading");
    const ready = cards.filter(isReady).length;
    const look = cards.length - waiting - reading - ready - n("asking");
    const total = cards.length, doneCount = total - waiting - reading;
    bar.innerHTML = `
      <div class="qstats">
        <span><b class="num">${doneCount}</b> of <b class="num">${total}</b> read</span>
        ${waiting + reading ? `<span class="muted">${reading} reading, ${waiting} waiting</span>` : ""}
        <span class="xp"><b class="num">${ready}</b> ready</span>
        ${look ? `<span class="warn-t"><b class="num">${look}</b> need a look</span>` : ""}
      </div>
      <div class="qprog" aria-hidden="true"><i style="width:${total ? (doneCount / total) * 100 : 0}%"></i></div>
      ${ocrState === "loading" ? `<p class="small muted">Loading text recognition (about 6 MB, once per visit)…</p>` : ""}
      ${paused ? `<p class="small status err">${esc(pauseMsg)}</p>` : ""}
      <div class="row">
        <button type="button" class="primary" data-q="addall" ${ready ? "" : "disabled"}>Add ${ready} ready</button>
        ${paused ? `<button type="button" data-q="resume">Resume</button>` : waiting ? `<button type="button" data-q="pause">Pause</button>` : ""}
        <button type="button" data-q="clear">Clear queue</button>
      </div>`;
    bar.querySelectorAll("[data-q]").forEach((b) => b.addEventListener("click", () => {
      const q = b.dataset.q;
      if (q === "addall") commitCards(cards.filter(isReady));
      if (q === "pause") { paused = true; pauseMsg = "Paused. Screenshots being read now will finish."; pump(); }
      if (q === "resume") { paused = false; pump(); }
      if (q === "clear") {
        if (!b.dataset.confirm) { b.dataset.confirm = "1"; b.textContent = `Click again to remove all ${cards.length}`; return; }
        cards.slice().forEach(dropCard); paused = false; drawSummary();
      }
    }));
  }

  function renderCards() {
    const box = $("#cards");
    if (!box) return;
    cards.forEach((c) => { box.append(c.el); drawCard(c); });
    let dl = $("#member-names");
    if (!dl) { dl = document.createElement("datalist"); dl.id = "member-names"; document.body.append(dl); }
    dl.innerHTML = data.members.map((m) => `<option value="${esc(m.name)}">`).join("");
    drawSummary();
  }
  function dropCard(c) { if (c.url) URL.revokeObjectURL(c.url); if (c.el) c.el.remove(); cards = cards.filter((x) => x !== c); drawSummary(); }

  function commitCards(list) {
    list.forEach((c) => {
      const t = Date.parse(c.when);
      const name = c.name.trim();
      if (c.personal && !data.selfName) data.selfName = name;
      let m = data.members.find((x) => key(x.name) === key(name));
      if (!m) { m = { name, rank: "", entries: [] }; data.members.push(m); }
      if (c.rank.trim()) m.rank = c.rank.trim();
      m.entries.push({ t: new Date(t).toISOString(), gems: +c.gems, xp: +c.xp });
      dropCard(c);
    });
    change();
  }

  // ---------- screenshot dates ----------
  // Best guess at when a screenshot was taken: photo info (JPEG EXIF), then a date in the
  // file name, then the file's saved time. Pasted images have none of these, so they get "now".
  async function guessDate(file) {
    const now = Date.now();
    const ok = (ms) => ms && ms <= now + 60e3 && ms > now - 400 * DAY;
    try { if (/jpe?g/i.test(file.type)) { const ms = await exifDate(file); if (ok(ms)) return { ms, src: "photo info" }; } } catch {}
    const fn = nameDate(file.name || "");
    if (ok(fn)) return { ms: fn, src: "file name" };
    if (ok(file.lastModified) && now - file.lastModified > 5000) return { ms: file.lastModified, src: "file's saved time" };
    return { ms: now, src: "time added" };
  }
  function nameDate(n) {
    const m = n.match(/(20\d\d)[-_.]?(0[1-9]|1[0-2])[-_.]?(0[1-9]|[12]\d|3[01])(?:\D{0,4}?([01]\d|2[0-3])[-_.:h]?([0-5]\d)(?:[-_.:m]?([0-5]\d))?)?/);
    return m ? new Date(+m[1], m[2] - 1, +m[3], m[4] ? +m[4] : 12, +(m[5] || 0), +(m[6] || 0)).getTime() : null;
  }
  async function exifDate(file) {
    const v = new DataView(await file.slice(0, 131072).arrayBuffer());
    if (v.getUint16(0) !== 0xffd8) return null;
    let o = 2;
    while (o + 10 < v.byteLength) {
      const marker = v.getUint16(o), len = v.getUint16(o + 2);
      if ((marker & 0xff00) !== 0xff00) return null;
      if (marker === 0xffe1 && v.getUint32(o + 4) === 0x45786966) return tiffDate(v, o + 10);
      o += 2 + len;
    }
    return null;
  }
  function tiffDate(v, t) {
    const le = v.getUint16(t) === 0x4949;
    const u16 = (p) => v.getUint16(p, le), u32 = (p) => v.getUint32(p, le);
    const ifd = (p) => { const out = {}; for (let i = 0, n = u16(p); i < n; i++) { const e = p + 2 + i * 12; out[u16(e)] = { count: u32(e + 4), off: e + 8 }; } return out; };
    const str = (ent) => { const p = ent.count > 4 ? t + u32(ent.off) : ent.off; let s = ""; for (let i = 0; i < ent.count - 1; i++) s += String.fromCharCode(v.getUint8(p + i)); return s; };
    const ifd0 = ifd(t + u32(t + 4));
    let s = null;
    if (ifd0[0x8769]) { const ex = ifd(t + u32(ifd0[0x8769].off)); if (ex[0x9003]) s = str(ex[0x9003]); }
    if (!s && ifd0[0x0132]) s = str(ifd0[0x0132]);
    const m = s && s.match(/(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d):(\d\d)/);
    return m ? new Date(+m[1], m[2] - 1, +m[3], +m[4], +m[5], +m[6]).getTime() : null;
  }

  function renderMembers() {
    const box = $("#members");
    if (!box) return;
    if (!data.members.length) { box.innerHTML = `<p class="small muted">No members yet. Add a screenshot above.</p>`; return; }
    const open = new Set(JSON.parse(ss.get("pc-open") || "[]"));
    box.innerHTML = data.members.slice().sort((a, b) => a.name.localeCompare(b.name)).map((m) => {
      const i = data.members.indexOf(m);
      const es = m.entries.map((e, j) => ({ ...e, j })).sort((a, b) => Date.parse(b.t) - Date.parse(a.t));
      return `<details class="member" data-m="${i}" ${open.has(m.name) ? "open" : ""}>
        <summary><b>${esc(m.name)}</b>${m.rank ? `<span class="chip r-${m.rank.toLowerCase().replace(/[^a-z]/g, "")}">${esc(m.rank)}</span>` : ""}<span class="small muted">${m.entries.length} screenshot${m.entries.length === 1 ? "" : "s"}</span></summary>
        <div class="inner">
          <div class="row">
            <input type="text" id="m${i}-name" value="${esc(m.name)}" aria-label="Username">
            <input type="text" id="m${i}-rank" value="${esc(m.rank)}" aria-label="Rank" placeholder="Rank">
            <button type="button" data-act="rename">Update name and rank</button>
            <button type="button" class="danger" data-act="del">Remove member</button>
          </div>
          <div class="scroll"><table class="entries"><thead><tr><th>Taken</th><th>Gems donated</th><th>XP contributed</th><th></th></tr></thead><tbody>
            ${es.map((e) => `<tr><td>${dateFmt(Date.parse(e.t), { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" })}</td><td class="num">${fmt(e.gems)}</td><td class="num">${fmt(e.xp)}</td><td><button type="button" class="link" data-del-entry="${e.j}">Delete</button></td></tr>`).join("")}
          </tbody></table></div>
        </div>
      </details>`;
    }).join("");
    box.querySelectorAll("details.member").forEach((d) => {
      const m = data.members[+d.dataset.m];
      d.addEventListener("toggle", () => {
        const s = new Set(JSON.parse(ss.get("pc-open") || "[]"));
        d.open ? s.add(m.name) : s.delete(m.name);
        ss.set("pc-open", JSON.stringify([...s]));
      });
      d.querySelector('[data-act="rename"]').onclick = () => {
        const nn = d.querySelector('[id$="-name"]').value.trim();
        if (!nn) return;
        if (data.members.some((x) => x !== m && key(x.name) === key(nn))) { d.querySelector('[id$="-name"]').setCustomValidity("Another member already has this name"); d.querySelector('[id$="-name"]').reportValidity(); return; }
        m.name = nn; m.rank = d.querySelector('[id$="-rank"]').value.trim(); change();
      };
      const delBtn = d.querySelector('[data-act="del"]');
      delBtn.onclick = () => {
        if (delBtn.dataset.confirm) { data.members.splice(data.members.indexOf(m), 1); change(); }
        else { delBtn.dataset.confirm = "1"; delBtn.textContent = "Click again to remove " + m.name; }
      };
      d.querySelectorAll("[data-del-entry]").forEach((b) => {
        b.onclick = () => { m.entries.splice(+b.dataset.delEntry, 1); if (!m.entries.length) data.members.splice(data.members.indexOf(m), 1); change(); };
      });
    });
  }

  // ---------- saving ----------
  const HEAD = '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>\n';
  function buildHtml(state) {
    const fonts = '<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fira+Sans:wght@500;600;700&display=swap">';
    const css = document.getElementById("app-style").textContent;
    const tpl = document.getElementById("shell-tpl").innerHTML;
    const js = document.getElementById("app-script").textContent;
    const json = JSON.stringify(state).replace(/</g, "\\u003c");
    return HEAD + "<title>Pink Cat Clan Tracker</title>\n" + fonts + '\n<style id="app-style">' + css + '</style>\n\n<template id="shell-tpl">' + tpl + '</template>\n<div id="app"></div>\n<script type="application/json" id="state">' + json + '<\/script>\n<script id="app-script">' + js + "<\/script>\n</body></html>";
  }
  async function save() {
    const btn = $("#save-all");
    if (!htmlOnly) {
      btn.disabled = true; btn.textContent = "Saving…";
      try {
        await artifactApi.publish({ "index.html": { content: buildHtml(data), contentType: "text/html" } });
        SAVED = structuredClone(data); dirty = 0; render(); renderEditor();
        return;
      } catch (e) {
        const code = e && e.code;
        if (code !== "capability_disabled" && code !== "invalid_content" && code !== "read_only_path" && code !== "capability_removed" && code !== "transform_error") return saveFailed(btn, e);
        htmlOnly = true;
        btn.disabled = false; btn.textContent = "Save for everyone";
      }
    }
    if (cards.length && !btn.dataset.confirm) {
      btn.dataset.confirm = "1";
      btn.textContent = `Save anyway (${cards.length} queued screenshot${cards.length > 1 ? "s" : ""} will be dropped)`;
      return;
    }
    btn.disabled = true; btn.textContent = "Saving…";
    try {
      await artifactApi.publish(buildHtml(data));
    } catch (e) {
      saveFailed(btn, e);
    }
  }
  function saveFailed(btn, e) {
    const msg = {
      conflict: "Someone else saved first. The page is reloading with their version; add your screenshots again.",
      not_writer: "Your account can view this tracker but not change it. Ask the owner for edit access.",
      not_granted: "Saving wasn't allowed. Check the artifact's permissions and try again.",
      rate_limited: "Too many saves in a row. Wait a minute and try again.",
    }[e && e.code] || "Saving failed. Try again in a moment.";
    btn.disabled = false; btn.textContent = "Save for everyone";
    btn.closest(".savebar").querySelector("span").textContent = msg;
  }

  // ---------- boot ----------
  $("#app").replaceWith(document.getElementById("shell-tpl").content.cloneNode(true));
  unlocked = ss.get("pc-unlocked") === "1";
  $("#period-select").addEventListener("change", (e) => { periodIdx = +e.target.value; render(); });
  $("#board").addEventListener("click", (e) => {
    const b = e.target.closest("[data-sort]");
    if (!b) return;
    const k = b.dataset.sort;
    if (sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = k === "name" ? 1 : -1; }
    render();
  });
  document.addEventListener("paste", (e) => {
    if (!unlocked) return;
    const files = [...(e.clipboardData?.files || [])].filter((f) => f.type.startsWith("image/"));
    if (files.length) { e.preventDefault(); addFiles(files); }
  });
  render();
  renderEditor();
  tick();
  setInterval(tick, 1000);

  if (window.claude && window.claude.use) {
    window.claude.use("artifact").then((a) => { artifactApi = a; if (unlocked) renderEditor(); });
    window.claude.use("sample").then(async (s) => {
      sampleApi = s;
      if (s) { try { sampleLimits = await s.limits(); sampleImages = !!sampleLimits.images; } catch { sampleImages = false; } }
      sampleReady = true;
      if (unlocked) { renderEditor(); }
      pump();
    });
  }
})();
</script>
