<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pink Cat Clan Tracker</title>
<meta name="description" content="Gems donated and XP contributed by Pink Cat [PINK] clan members in Pixel Worlds.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fira+Sans:wght@500;600;700&display=swap">
<style id="app-style">
/* Layout: in-game windows floating over a dark block world. A gold-framed clan window holds totals and the
   member list, staff tools sit in a second window, and a hotbar-style countdown is pinned to the bottom.
   One deliberate look (the game's own UI), so no separate light/dark palettes. */
:root {
  --world: #0a1424;        /* night sky behind the blocks */
  --block: #1b2738;        /* background block faces */
  --block-edge: #26354a;
  --gold: #f6c700;         /* window frame */
  --gold-dk: #9a7a00;
  --olive: #a7bb1d;        /* frame inner bevel */
  --olive-dk: #74870d;
  --cream: #f6efd3;        /* window body */
  --cyan: #a3def0;         /* stat rows */
  --cyan-dk: #6fc0dc;
  --banner: #7dd0f0;       /* title pill */
  --banner-dk: #2f8ec4;
  --navy: #1d5b86;         /* labels, pills */
  --ink: #163a57;          /* text on light surfaces */
  --white: #ffffff;
  --orange: #ffa21f;       /* main button */
  --orange-dk: #e26a00;
  --gem: #1777c2;
  --xp: #3b9a0e;
  --bar: #57c81c;          /* progress bar green */
  --warn: #b77b00;
  --bad: #d23b22;
  --leader: #8e3fe0;
  --elder: #2f9e1e;
  --veteran: #1f74c8;
  --member: #5b6b7a;
  --font-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --font-body: "Fira Sans", "Segoe UI", system-ui, sans-serif;
  --outline: 0 2px 0 var(--ink), 0 -2px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink),
             1.5px 1.5px 0 var(--ink), -1.5px 1.5px 0 var(--ink), 1.5px -1.5px 0 var(--ink), -1.5px -1.5px 0 var(--ink), 0 4px 0 rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
body {
  color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  background-color: var(--world);
  /* stone blocks: 64px tiles with a darker seam and a lighter top-left bevel */
  background-image:
    linear-gradient(rgba(10, 20, 36, .55), rgba(10, 20, 36, .85)),
    linear-gradient(90deg, var(--block-edge) 0 3px, transparent 3px),
    linear-gradient(var(--block-edge) 0 3px, transparent 3px),
    linear-gradient(135deg, #223146 0 30%, var(--block) 30% 100%);
  background-size: auto, 64px 64px, 64px 64px, 64px 64px;
  background-attachment: fixed;
}
.wrap { max-width: 1040px; margin: 0 auto; padding-inline: 16px; padding-block: 44px 130px; display: grid; gap: 46px; }
.wrap > *, .window-in > *, .editor > *, .panel > *, .cards > * { min-width: 0; }
input, select { max-width: 100%; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: .01em; }
h2 { font-size: 22px; }
h3 { font-size: 18px; }
p { margin: 0; }
.muted { color: color-mix(in srgb, var(--ink) 62%, var(--cream)); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.gem { color: var(--gem); }
.xp { color: var(--xp); }
.ico { display: inline-block; width: 15px; height: 15px; vertical-align: -2px; margin-right: 5px; }
.outlined { color: var(--white); text-shadow: var(--outline); }

/* ---------- game window ---------- */
.window {
  position: relative; border-radius: 16px; padding: 12px;
  background: linear-gradient(var(--olive), var(--olive-dk));
  border: 5px solid var(--gold);
  box-shadow: 0 0 0 2px var(--gold-dk), inset 0 0 0 2px rgba(255,255,255,.35), 0 18px 40px rgba(0,0,0,.55);
}
.window-in { background: var(--cream); border-radius: 10px; padding: 34px 14px 14px; display: grid; gap: 14px; box-shadow: inset 0 2px 0 rgba(0,0,0,.08); }
.banner {
  position: absolute; left: 50%; top: 0; transform: translate(-50%, -55%);
  max-width: calc(100% - 32px); width: max-content; padding: 8px 34px 10px;
  border-radius: 999px; border: 3px solid var(--banner-dk);
  background: linear-gradient(#b6e9fb 0 40%, var(--banner) 40% 100%);
  box-shadow: inset 0 -4px 0 rgba(0,0,0,.12), 0 3px 0 rgba(0,0,0,.25);
  font-size: clamp(22px, 5.4vw, 34px); line-height: 1.1; text-align: center; white-space: nowrap;
  color: var(--white); text-shadow: var(--outline);
}
.banner .tag { color: #ffc6ea; }

.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; }
.top .sub { max-width: 60ch; color: var(--ink); }
.period-pick { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
/* LIVE / FINAL badge in the staff showdown panel */
.comp-badge { display: inline-block; border-radius: 999px; padding: 1px 10px 2px; font-family: var(--font-display); font-size: 14px; letter-spacing: .08em; color: var(--white); box-shadow: inset 0 -2px 0 rgba(0,0,0,.25); }
.comp-badge.live { background: #2f9e1e; }
.comp-badge.final { background: var(--navy); }
th.picked { background: #ffe9a6; border-radius: 6px 6px 0 0; }
.comp-board td.num:not(.small) { font-family: var(--font-display); font-size: 20px; }
.comp-board td.gain.xp, .comp-board td.gain.gem { font-weight: 400; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.form-grid label { display: grid; gap: 3px; font-size: 12px; font-weight: 700; color: var(--navy); min-width: 0; }
.form-grid label[hidden] { display: none; }
textarea { width: 100%; font: inherit; font-weight: 600; color: var(--ink); background: var(--white); border: 2px solid var(--navy); border-radius: 4px; padding: 6px 10px; color-scheme: light; }
code { background: var(--white); border: 1px solid var(--cyan-dk); border-radius: 4px; padding: 0 4px; font-size: .95em; }
.base-table input { width: 9em; padding: 3px 6px; }
.panel h3 { color: var(--navy); }

/* date range slider: game progress-bar track with orange knobs */
.range { display: grid; gap: 10px; background: var(--cyan); border-radius: 8px; padding: 10px 12px 12px; box-shadow: inset 0 -3px 0 var(--cyan-dk), inset 0 2px 0 rgba(255,255,255,.5); }
.range-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.range-head output { font-family: var(--font-display); font-size: 18px; color: var(--ink); background: var(--white); border: 2px solid var(--navy); border-radius: 4px; padding: 0 8px; }
.range-head .days { color: var(--navy); font-weight: 700; font-size: 13px; }
.range-quick { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.range-quick button { font-size: 14px; padding: 2px 10px; }
.dual { position: relative; height: 32px; }
.dual-track { position: absolute; left: 14px; right: 14px; top: 9px; height: 14px; border-radius: 99px; background: #0f3554; border: 2px solid #0b2740; }
.dual-track i { position: absolute; top: 0; bottom: 0; border-radius: 99px; background: linear-gradient(#8ee85a 0 40%, var(--bar) 40% 100%); }
.dual-track b { position: absolute; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%; background: var(--white); opacity: .85; }
.dual input[type=range] { position: absolute; inset: 0; width: 100%; height: 32px; margin: 0; background: none; pointer-events: none; -webkit-appearance: none; appearance: none; }
.dual input[type=range]::-webkit-slider-runnable-track { height: 32px; background: none; }
.dual input[type=range]::-moz-range-track { height: 32px; background: none; }
.dual input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; pointer-events: auto; width: 28px; height: 28px; margin-top: 2px; border-radius: 50%; cursor: grab;
  background: linear-gradient(#ffc04a 0 45%, var(--orange) 45% 100%); border: 3px solid #1f6f9f; box-shadow: 0 2px 0 rgba(0,0,0,.35); }
.dual input[type=range]::-moz-range-thumb { pointer-events: auto; width: 22px; height: 22px; border-radius: 50%; cursor: grab;
  background: linear-gradient(#ffc04a 0 45%, var(--orange) 45% 100%); border: 3px solid #1f6f9f; box-shadow: 0 2px 0 rgba(0,0,0,.35); }
.dual input[type=range]:focus-visible { outline: none; }
.dual input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px var(--white), 0 0 0 6px var(--orange); }
.dual input[type=range]:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 3px var(--white), 0 0 0 6px var(--orange); }
.dual-ends { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: var(--navy); }
.img-dialog { position: fixed; inset: 0; z-index: 20; background: rgba(5, 12, 24, .78); display: grid; place-items: center; padding: 16px; }
.img-box { background: var(--cream); border: 5px solid var(--gold); border-radius: 14px; box-shadow: 0 0 0 2px var(--gold-dk), 0 20px 50px rgba(0,0,0,.6); padding: 14px; display: grid; gap: 10px; max-width: min(760px, 100%); max-height: calc(100% - 24px); min-width: 0; }
.img-scroll { overflow: auto; max-height: 70vh; border-radius: 8px; border: 2px solid var(--navy); background: var(--world); }
.img-scroll img { display: block; width: 100%; height: auto; }
.img-status { color: var(--ink); font-weight: 600; }
#img-open { font-size: 15px; padding: 4px 14px; }
.flash { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 30; max-width: calc(100% - 32px);
  background: #2f9e1e; color: var(--white); font-weight: 700; padding: 10px 18px; border-radius: 12px; border: 3px solid #1f6f9f; box-shadow: 0 4px 0 rgba(0,0,0,.35); }
.pill { display: inline-block; background: var(--navy); color: var(--white); border-radius: 999px; padding: 3px 12px; font-weight: 700; font-size: 13px; box-shadow: inset 0 -2px 0 rgba(0,0,0,.25); }

select, input, button { font: inherit; }
select, input[type=text], input[type=password], input[type=number], input[type=datetime-local] {
  background: var(--white); color: var(--ink); border: 2px solid var(--navy); border-radius: 4px; padding: 6px 10px; min-width: 0; font-weight: 600;
  box-shadow: inset 0 2px 0 rgba(0,0,0,.08); color-scheme: light;
}
select:focus-visible, input:focus-visible, button:focus-visible, summary:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }

/* sky-blue game button; .primary is the orange "Close"-style button */
button {
  cursor: pointer; border-radius: 10px; padding: 6px 16px; font-family: var(--font-display); font-size: 16px; letter-spacing: .02em;
  color: var(--white); text-shadow: 0 1px 0 var(--ink), 0 -1px 0 var(--ink), 1px 0 0 var(--ink), -1px 0 0 var(--ink), 0 2px 0 var(--ink);
  background: linear-gradient(#a9e4f8 0 45%, #5fbde6 45% 100%); border: 3px solid var(--banner-dk);
  box-shadow: inset 0 -3px 0 rgba(0,0,0,.15), 0 3px 0 rgba(0,0,0,.3);
}
button:hover { filter: brightness(1.07); }
button:active { transform: translateY(2px); box-shadow: inset 0 -1px 0 rgba(0,0,0,.15), 0 1px 0 rgba(0,0,0,.3); }
button.primary { background: linear-gradient(#ffc04a 0 45%, var(--orange) 45% 100%); border-color: #4aa8dc; box-shadow: inset 0 -3px 0 var(--orange-dk), 0 0 0 2px #1f6f9f, 0 4px 0 rgba(0,0,0,.35); }
button.danger { background: linear-gradient(#ff9a86 0 45%, #e5533a 45% 100%); border-color: #9b2a17; }
button.link { background: none; border: 0; box-shadow: none; padding: 0; font-family: var(--font-body); font-size: 14px; font-weight: 700; color: var(--banner-dk); text-shadow: none; text-decoration: underline; }
button:disabled { opacity: .5; cursor: default; filter: grayscale(.5); }

/* ---------- totals: rows like the clan perk list ---------- */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
.tile {
  background: var(--cyan); border-radius: 8px; padding: 10px 12px; display: grid; gap: 8px;
  box-shadow: inset 0 -3px 0 var(--cyan-dk), inset 0 2px 0 rgba(255,255,255,.5);
}
.tile .eyebrow { justify-self: start; background: var(--navy); color: var(--white); border-radius: 999px; padding: 3px 12px; font-size: 13px; font-weight: 700; }
.tile .eyebrow .ico { color: var(--white); }
.tile .big { background: var(--white); border: 2px solid var(--navy); border-radius: 4px; padding: 2px 10px; text-align: right; font-family: var(--font-display); font-size: 28px; line-height: 1.2; }
.tile .big.gem, .tile .big.xp { }
.tile .big .muted { font-family: var(--font-body); font-weight: 600; }
@media (max-width: 560px) {
  .tiles { gap: 6px; }
  .tile { grid-template-columns: 1fr auto; align-items: center; padding: 8px 10px; }
  .tile .big { font-size: 22px; min-width: 4.6em; }
  .tile .eyebrow { border-radius: 10px; font-size: 12px; }
  .wrap { padding-inline: 10px; }
  .window, .editor { border-width: 4px; padding: 8px; }
  .editor { padding-top: 40px; }
  .window-in { padding: 30px 10px 10px; }
  .banner { padding: 6px 22px 8px; }
}

/* ---------- member list ---------- */
.board { background: var(--cyan); border-radius: 10px; overflow: hidden; box-shadow: inset 0 -3px 0 var(--cyan-dk); }
.board-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 16px; padding: 10px 14px; background: var(--navy); color: var(--white); }
.board-head h2 { color: var(--white); text-shadow: 0 2px 0 rgba(0,0,0,.35); }
.board-head p { color: #d6effa; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: separate; border-spacing: 0 4px; padding: 0 6px 6px; }
th, td { padding: 8px 10px; text-align: right; }
th:nth-child(1), td:nth-child(1), th:nth-child(2), td:nth-child(2) { text-align: left; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--navy); white-space: nowrap; font-weight: 700; padding-top: 10px; }
th button { background: none; border: 0; box-shadow: none; padding: 0; font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit; text-shadow: none; }
th button[aria-sort] { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
tbody td { background: var(--cream); color: var(--ink); }
tbody tr:nth-child(even) td { background: #ece4c6; }
tbody td:first-child { border-radius: 8px 0 0 8px; }
tbody td:last-child { border-radius: 0 8px 8px 0; }
tbody tr:hover td { background: var(--white); }
td.rankno { font-family: var(--font-display); font-size: 18px; color: var(--navy); width: 1%; }
tbody tr:nth-child(1) td.rankno { color: #d9a400; }
tbody tr:nth-child(2) td.rankno { color: #8d9aa8; }
tbody tr:nth-child(3) td.rankno { color: #b36a2a; }
.who { display: grid; gap: 2px; }
.who b { font-size: 16px; font-weight: 700; }
.chip { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--member); color: var(--white); white-space: nowrap; }
.chip.r-leader, .chip.leader { background: var(--leader); }
.chip.r-coleader { background: #b04fc9; }
.chip.r-elder { background: var(--elder); }
.chip.r-veteran { background: var(--veteran); }
.chip.warn { background: #ffe9a6; color: #7a5200; }
.gain { font-weight: 700; }
.gain.gem { color: var(--gem); }
.gain.xp { color: var(--xp); }
.gain.zero { color: var(--member); font-weight: 500; }
.empty { padding: 28px 16px; text-align: center; display: grid; gap: 6px; justify-items: center; }

/* ---------- staff tools ---------- */
.editor-gate { background: linear-gradient(var(--olive), var(--olive-dk)); border: 4px solid var(--gold); border-radius: 12px; box-shadow: 0 0 0 2px var(--gold-dk); padding: 12px; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; color: var(--white); }
.editor-gate h3 { color: var(--white); text-shadow: var(--outline); }
.editor-gate p { color: #f4f8d8; }
.editor-gate form { display: flex; gap: 8px; flex-wrap: wrap; }
.editor-gate .status.err { color: #fff1ee; background: var(--bad); border-radius: 6px; padding: 2px 8px; }
.editor { display: grid; gap: 16px; position: relative; border-radius: 16px; padding: 46px 12px 12px; background: linear-gradient(var(--olive), var(--olive-dk)); border: 5px solid var(--gold); box-shadow: 0 0 0 2px var(--gold-dk), 0 18px 40px rgba(0,0,0,.55); }
.editor::before {
  content: "Clan Staff Tools"; position: absolute; left: 50%; top: 0; transform: translate(-50%, -55%); white-space: nowrap;
  padding: 6px 26px 8px; border-radius: 999px; border: 3px solid var(--banner-dk); background: linear-gradient(#b6e9fb 0 40%, var(--banner) 40% 100%);
  font-family: var(--font-display); font-size: 24px; color: var(--white); text-shadow: var(--outline);
}
.panel { background: var(--cream); border-radius: 10px; padding: 14px; display: grid; gap: 12px; }
.panel > h2, .panel > .row > h2 { justify-self: start; color: var(--white); text-shadow: 0 2px 0 rgba(0,0,0,.3); background: var(--navy); border-radius: 999px; padding: 2px 16px 4px; font-size: 19px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.drop { background: var(--cyan); border: 3px dashed var(--navy); border-radius: 10px; padding: 20px 16px; text-align: center; display: grid; gap: 8px; justify-items: center; }
.drop.over { background: #c9f0fb; border-color: var(--orange-dk); }
.drop input[type=file] { color: var(--ink); }
.cards { display: grid; gap: 10px; }
.card { display: grid; grid-template-columns: 180px 1fr; gap: 14px; background: var(--cyan); border-radius: 10px; padding: 12px; box-shadow: inset 0 -3px 0 var(--cyan-dk); }
.card img { width: 100%; border-radius: 6px; display: block; border: 2px solid var(--navy); }
.card .thumb { min-width: 0; }
.card .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; min-width: 0; align-content: start; }
.card label { display: grid; gap: 3px; font-size: 12px; font-weight: 700; color: var(--navy); }
.card .status { grid-column: 1 / -1; font-size: 13px; font-weight: 600; }
.card .actions { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; }
.status.err { color: var(--bad); }
.status.ok { color: var(--xp); }
.notes { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; }
.card.compact { grid-template-columns: 56px 1fr auto; align-items: center; padding: 8px 12px; }
.card.compact .thumb img { height: 40px; object-fit: cover; object-position: center 40%; }
.card.compact .line { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; min-width: 0; }
.card.compact .actions { display: flex; gap: 6px; grid-column: auto; }
.card.compact button { padding: 3px 10px; font-size: 14px; }
.card.ready { background: #c7efb0; box-shadow: inset 0 -3px 0 #8fcf6a; }
.card.zoom { grid-template-columns: 1fr; }
.card.zoom .thumb { max-width: none; }
.card .src { font-weight: 500; }
@media (max-width: 560px) { .card { grid-template-columns: 1fr; } .card .thumb { max-width: 220px; } .card.compact { grid-template-columns: 48px 1fr; } .card.compact .actions { grid-column: 1 / -1; } }
.queuebar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 3; background: var(--navy); color: var(--white); border-radius: 10px; padding: 12px 14px; display: grid; gap: 10px; box-shadow: 0 4px 0 rgba(0,0,0,.25); }
.queuebar .muted { color: #cde9f6; }
.queuebar .xp { color: #b6f58a; }
.queuebar .status.err { color: #ffd2c9; }
.qstats { display: flex; flex-wrap: wrap; gap: 4px 18px; }
.warn-t { color: #ffd76a; }
.qprog { height: 14px; border-radius: 99px; background: #0f3554; border: 2px solid #0b2740; overflow: hidden; }
.qprog i { display: block; height: 100%; background: linear-gradient(#8ee85a 0 40%, var(--bar) 40% 100%); border-radius: 99px; transition: width .3s; }
@media (prefers-reduced-motion: reduce) { .qprog i { transition: none; } button:active { transform: none; } }

details.member { border-radius: 8px; background: var(--cyan); box-shadow: inset 0 -3px 0 var(--cyan-dk); }
details.member summary { cursor: pointer; padding: 10px 12px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; color: var(--ink); }
details.member .inner { padding: 0 12px 12px; display: grid; gap: 10px; }
.entries td, .entries th { padding: 6px 8px; font-size: 13px; }
.entries { padding: 0; }

.savebar { position: sticky; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 4; background: var(--orange); color: var(--white); text-shadow: 0 1px 0 var(--orange-dk); border: 3px solid #4aa8dc; border-radius: 12px; padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; font-weight: 700; box-shadow: 0 0 0 2px #1f6f9f, 0 6px 0 rgba(0,0,0,.35); }
.savebar button.primary { background: linear-gradient(#7fe24c 0 45%, #3fae10 45% 100%); border-color: #1f6f9f; box-shadow: inset 0 -3px 0 #2c7e08, 0 3px 0 rgba(0,0,0,.3); }
.savebar button.ghost { background: linear-gradient(#ffe0b0 0 45%, #ffc77a 45% 100%); border-color: var(--orange-dk); }

/* ---------- hotbar countdown ---------- */
.countdown {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; color: var(--white);
  background: linear-gradient(#173a5c, #0e2741); border-top: 3px solid #3c8cc4; box-shadow: 0 -4px 0 rgba(0,0,0,.35);
  padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px));
}
.countdown .in { max-width: 1040px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 16px; }
.countdown .label { font-family: var(--font-display); font-size: 18px; text-shadow: var(--outline); }
.countdown .small { color: #bfe2f5; }
.clock { display: flex; gap: 6px; font-variant-numeric: tabular-nums; }
.clock .slot { display: grid; justify-items: center; min-width: 52px; padding: 2px 6px 3px; border-radius: 8px; background: linear-gradient(#24496c, #163452); border: 2px solid #4f9fd3; box-shadow: inset 0 2px 0 rgba(255,255,255,.12); }
.clock .slot b { font-family: var(--font-display); font-weight: 400; font-size: clamp(20px, 5vw, 26px); line-height: 1.1; color: var(--gold); text-shadow: 0 2px 0 rgba(0,0,0,.5); }
.clock .slot span { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: #bfe2f5; }
</style>
</head>
<body>

<template id="shell-tpl">
<main class="wrap">
  <section class="window" aria-labelledby="clan-title">
    <h1 class="banner" id="clan-title">Pink Cat <span class="tag">[PINK]</span></h1>
    <div class="window-in">
      <div class="top">
        <p class="sub">Gems donated and XP contributed by every clan member, refreshed from in-game screenshots.</p>
        <label class="period-pick"><span class="pill">Showing</span><select id="period-select"></select></label>
      </div>
      <div class="range" id="range-box" hidden>
        <div class="range-head">
          <span class="pill">From</span><output id="range-from"></output>
          <span class="pill">to</span><output id="range-to"></output>
          <span class="days" id="range-days"></span>
          <span class="range-quick">
            <button type="button" data-days="7">Last 7 days</button>
            <button type="button" data-days="30">Last 30 days</button>
            <button type="button" data-days="all">Since tracking began</button>
          </span>
        </div>
        <div class="dual">
          <div class="dual-track" id="dual-track"><i id="dual-fill"></i></div>
          <input type="range" id="range-a" min="0" max="1" step="1" value="0" aria-label="First day">
          <input type="range" id="range-b" min="0" max="1" step="1" value="1" aria-label="Last day">
        </div>
        <div class="dual-ends"><span id="range-min"></span><span class="small">White dots are days with screenshots</span><span id="range-max"></span></div>
      </div>
      <section class="tiles" id="tiles" aria-label="Clan totals"></section>
      <section class="board" aria-labelledby="board-title">
        <div class="board-head">
          <h2 id="board-title">Clan Members</h2>
          <p class="small" id="board-note"></p>
          <button type="button" id="img-open">Save standings as image</button>
        </div>
        <div class="scroll"><table id="board"></table></div>
      </section>
    </div>
  </section>

  <section id="editor-root" aria-label="Editor"></section>
</main>
<footer class="countdown" aria-live="off">
  <div class="in">
    <div>
      <p class="label">Clan deadline in</p>
      <p class="small" id="deadline-text"></p>
    </div>
    <div class="clock" id="clock">-</div>
  </div>
</footer>
</template>
<div id="app"></div>
<script id="app-script">
(function () {
  const DAY = 864e5;
  // Filled from data.json at start-up; until then the page shows a loading state.
  let SAVED = { anchor: "2026-10-25T18:00:00.000Z", periodDays: 14, members: [] };
  let loaded = false;
  let data = structuredClone(SAVED);
  let dirty = 0;
  let sortKey = "pGems", sortDir = -1;
  let periodIdx = 0;
  let custom = null; // {a, b}: day offsets from rangeBounds().first when filtering by dates
  let view = "period"; // "period" | "custom" | "comp"
  const compVisible = () => !!data.comp && (!data.comp.hidden || unlocked);
  let unlocked = false;
  let cards = [];
  let cardSeq = 0;

  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmt = (n) => (n == null ? "-" : Math.round(n).toLocaleString("en-US").replace(/,/g, " "));
  const signed = (n) => (n > 0 ? "+" : n < 0 ? "−" : "") + fmt(Math.abs(n));
  const key = (name) => name.trim().toLowerCase();
  const ss = { get(k) { try { return sessionStorage.getItem(k); } catch { return null; } }, set(k, v) { try { sessionStorage.setItem(k, v); } catch {} }, del(k) { try { sessionStorage.removeItem(k); } catch {} } };

  const GEM_SVG = '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M4 2h8l3 4-7 9-7-9z"/><path fill="#0d1820" opacity=".35" d="M1 6h14L8 15z"/></svg>';
  const XP_SVG = '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="currentColor"/><text x="8" y="11.2" text-anchor="middle" font-size="8" font-weight="900" font-family="sans-serif" fill="#0d1820">XP</text></svg>';

  // ---------- periods ----------
  function periodLen() { return data.periodDays * DAY; }
  function currentEnd(now) {
    const a = Date.parse(data.anchor), len = periodLen();
    let k = Math.max(0, Math.ceil((now - a) / len));
    let end = a + k * len;
    if (end <= now) end += len;
    return end;
  }
  function periods(now) {
    const a = Date.parse(data.anchor), len = periodLen();
    const out = [];
    for (let end = currentEnd(now); end >= a; end -= len) out.push({ start: end - len, end, current: out.length === 0 });
    return out;
  }
  const dateFmt = (ms, opts) => new Date(ms).toLocaleString(undefined, opts);
  const shortDate = (ms) => dateFmt(ms, { day: "numeric", month: "short" });

  // ---------- custom date range ----------
  const startOfDay = (ms) => { const d = new Date(ms); d.setHours(0, 0, 0, 0); return d.getTime(); };
  const addDays = (ms, n) => { const d = new Date(ms); d.setDate(d.getDate() + n); return d.getTime(); };
  const dayDiff = (a, b) => Math.round((b - a) / DAY);
  function rangeBounds() {
    // The slider starts at the first screenshot, or a week back when tracking is newer than that.
    const today = startOfDay(Date.now());
    let firstShot = today;
    data.members.forEach((m) => m.entries.forEach((e) => { firstShot = Math.min(firstShot, startOfDay(Date.parse(e.t))); }));
    const first = Math.min(firstShot, addDays(today, -6));
    return { first, days: dayDiff(first, today), firstShot: dayDiff(first, firstShot) };
  }
  function customPeriod() {
    const { first } = rangeBounds();
    return { start: addDays(first, custom.a), end: addDays(first, custom.b + 1), custom: true };
  }
  function setCustom(a, b) {
    const { days } = rangeBounds();
    custom = { a: Math.max(0, Math.min(a, days)), b: Math.max(0, Math.min(b, days)) };
    if (custom.a > custom.b) custom.a = custom.b;
  }
  function drawRange() {
    const box = $("#range-box");
    box.hidden = view !== "custom" || !custom;
    if (box.hidden) return;
    const { first, days } = rangeBounds();
    const A = $("#range-a"), B = $("#range-b");
    [A, B].forEach((el) => { el.max = String(days); });
    // The knobs may cross while dragging; only re-seat them when neither is being moved.
    if (document.activeElement !== A && document.activeElement !== B) { A.value = String(custom.a); B.value = String(custom.b); }
    // with both knobs at the right end, keep the start knob on top so it can be dragged back
    A.style.zIndex = +A.value >= days ? "3" : "1";
    const pct = (i) => (days ? (i / days) * 100 : 0);
    const fill = $("#dual-fill");
    fill.style.left = pct(custom.a) + "%"; fill.style.right = (100 - pct(custom.b)) + "%";
    const shotDays = new Set();
    data.members.forEach((m) => m.entries.forEach((e) => shotDays.add(dayDiff(first, startOfDay(Date.parse(e.t))))));
    $("#dual-track").querySelectorAll("b").forEach((d) => d.remove());
    shotDays.forEach((i) => { const d = document.createElement("b"); d.style.left = pct(i) + "%"; $("#dual-track").append(d); });
    const long = { weekday: "short", day: "numeric", month: "short" };
    $("#range-from").textContent = dateFmt(addDays(first, custom.a), long);
    $("#range-to").textContent = dateFmt(addDays(first, custom.b), long);
    const n = custom.b - custom.a + 1;
    $("#range-days").textContent = n + (n === 1 ? " day" : " days");
    $("#range-min").textContent = shortDate(first);
    $("#range-max").textContent = "Today";
    A.setAttribute("aria-valuetext", $("#range-from").textContent);
    B.setAttribute("aria-valuetext", $("#range-to").textContent);
  }

  const diff = (a, b) => (a == null || b == null ? null : a - b);
  const lastGems = (list) => { for (let i = list.length - 1; i >= 0; i--) if (list[i].gems != null) return list[i].gems; return null; };
  const firstGems = (list) => { for (const e of list) if (e.gems != null) return e.gems; return null; };

  function stats(m, p) {
    const es = m.entries.slice().sort((x, y) => Date.parse(x.t) - Date.parse(y.t));
    const upTo = es.filter((e) => Date.parse(e.t) < p.end);
    if (!upTo.length) return null;
    const latest = upTo[upTo.length - 1];
    const before = upTo.filter((e) => Date.parse(e.t) < p.start);
    const base = before.length ? before[before.length - 1] : upTo[0];
    const updated = Date.parse(latest.t) >= p.start;
    const baselineOnly = !before.length && latest === base;
    return {
      name: m.name, rank: m.rank, lastT: Date.parse(latest.t), updated, baselineOnly,
      gems: lastGems(upTo), xp: latest.xp,
      pGems: baselineOnly ? null : diff(latest.gems, base.gems),
      pXp: baselineOnly ? null : latest.xp - base.xp,
    };
  }

  // ---------- Clan Showdown (competition) ----------
  // data.comp = { name, start, end (ISO or null = until closed), metric: "pXp" | "pGems" | "xp" | "gems",
  //               base: { lowercased name: { xp, gems } }, hidden }
  // Scores count screenshots taken from `start` up to `end`, measured against each member's baseline.
  // A member without a stored baseline starts from their last screenshot before the start (or their first one after it).
  const METRICS = { pXp: "XP earned since the start", pGems: "Gems donated since the start", xp: "Lifetime XP contributed", gems: "Lifetime gems donated" };
  const METRIC_SHORT = { pXp: "XP earned", pGems: "Gems donated", xp: "Lifetime XP", gems: "Lifetime gems" };
  const compEnd = () => (data.comp && data.comp.end ? Date.parse(data.comp.end) : Infinity);
  const compLive = () => !!data.comp && Date.now() < compEnd();
  function compStats(m) {
    const c = data.comp, start = Date.parse(c.start), end = compEnd();
    const es = m.entries.slice().sort((x, y) => Date.parse(x.t) - Date.parse(y.t));
    const upTo = es.filter((e) => Date.parse(e.t) < end);
    if (!upTo.length) return null;
    const before = upTo.filter((e) => Date.parse(e.t) < start), after = upTo.filter((e) => Date.parse(e.t) >= start);
    const b = c.base[key(m.name)] || {};
    const xpBase = b.xp != null ? b.xp : before.length ? before[before.length - 1].xp : after[0].xp;
    const gemsBase = b.gems != null ? b.gems : lastGems(before) ?? firstGems(after);
    const last = after[after.length - 1];
    const latest = upTo[upTo.length - 1];
    return {
      name: m.name, rank: m.rank, lastT: Date.parse(latest.t), updated: !!last, baselineOnly: false,
      gems: lastGems(upTo), xp: latest.xp,
      pXp: last ? last.xp - xpBase : 0,
      pGems: last ? diff(last.gems, gemsBase) : 0,
    };
  }
  function compStatus() {
    const c = data.comp, end = compEnd(), now = Date.now();
    if (now >= end) return { live: false, text: `Finished ${dateFmt(end, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}` };
    if (end === Infinity) return { live: true, text: "No end date: runs until it's closed" };
    let s = Math.floor((end - now) / 1000);
    const d = Math.floor(s / 86400); s -= d * 86400;
    const h = Math.floor(s / 3600); s -= h * 3600;
    const mi = Math.floor(s / 60); s -= mi * 60;
    return { live: true, text: `Ends in ${d ? d + "d " : ""}${String(h).padStart(2, "0")}h ${String(mi).padStart(2, "0")}m ${String(s).padStart(2, "0")}s` };
  }
  // Time left or "finished", and nothing at all for an open-ended showdown.
  const compTiming = () => (data.comp && (data.comp.end || !compLive()) ? compStatus().text : "");
  function drawCompHead() {
    const left = $("#comp-left");
    if (left && data.comp) left.textContent = compTiming();
  }


  // ---------- leaderboard ----------
  function render() {
    if (!loaded) {
      $("#board").innerHTML = `<tbody><tr><td><div class="empty"><h3>Loading the clan…</h3></div></td></tr></tbody>`;
      $("#tiles").innerHTML = "";
      return;
    }
    const ps = periods(Date.now());
    if (periodIdx >= ps.length) periodIdx = 0;
    if (view === "comp" && !compVisible()) view = "period";
    if (view === "custom") setCustom(custom.a, custom.b); // keep the range inside today's bounds
    const sel = $("#period-select");
    sel.innerHTML = (compVisible() ? `<option value="comp">${esc(data.comp.name || "Clan Showdown")} (${compLive() ? "live" : "results"})</option>` : "")
      + ps.map((q, i) => `<option value="${i}">${q.current ? "Current period" : "Past period"}: ${shortDate(q.start)} to ${shortDate(q.end)}</option>`).join("")
      + `<option value="custom">Custom dates (slider)</option>`;
    sel.value = view === "comp" ? "comp" : view === "custom" ? "custom" : String(periodIdx);
    drawRange();
    drawCompHead();

    const isComp = view === "comp";
    const p = isComp ? null : view === "custom" ? customPeriod() : ps[periodIdx];
    const scope = isComp ? "since the start" : view === "custom" ? "in range" : "this period";
    const rows = data.members.map((m) => (isComp ? compStats(m) : stats(m, p))).filter(Boolean);
    const upd = rows.filter((r) => r.updated).length;
    const total = (k) => rows.reduce((s, r) => s + (r[k] || 0), 0);
    const pre = !isComp && view === "period" && Date.now() < p.start; // before the very first period has begun

    if (isComp) {
      // Everyone sees only the measure the staff picked; unlocked staff see all four.
      const mk = data.comp.metric;
      const icon = mk === "pGems" || mk === "gems" ? GEM_SVG : XP_SVG, cls = mk === "pGems" || mk === "gems" ? "gem" : "xp";
      $("#tiles").innerHTML = `
        <div class="tile"><span class="eyebrow">${icon}${METRICS[mk]}, whole clan</span><span class="big num ${cls}">${fmt(total(mk))}</span></div>
        <div class="tile"><span class="eyebrow">Members with a new screenshot</span><span class="big num">${upd} <span class="muted" style="font-size:.6em">of ${rows.length}</span></span></div>`;
      const timing = compTiming();
      $("#board-note").innerHTML = (timing ? `<b id="comp-left">${esc(timing)}</b> · ` : "") + esc(`Ranked by ${METRICS[data.comp.metric].replace(/^\w/, (ch) => ch.toLowerCase()).replace(/^xP/, "XP")}.`) + (dirty ? " Showing unsaved changes." : "");
    } else {
      $("#tiles").innerHTML = `
        <div class="tile"><span class="eyebrow">${GEM_SVG}Gems donated ${scope}</span><span class="big num gem">${fmt(total("pGems"))}</span></div>
        <div class="tile"><span class="eyebrow">${XP_SVG}XP earned ${scope}</span><span class="big num xp">${fmt(total("pXp"))}</span></div>
        <div class="tile"><span class="eyebrow">Members updated ${scope}</span><span class="big num">${upd} <span class="muted" style="font-size:.6em">of ${rows.length}</span></span></div>`;
      $("#board-note").textContent = (view === "custom"
        ? `Gains from each member's last screenshot before ${shortDate(p.start)} to their last one by the end of ${shortDate(p.end - 1)}.`
        : pre
        ? `The first period starts ${dateFmt(p.start, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}. Screenshots added before then are each member's starting point.`
        : `Period gains count from each member's last screenshot before ${shortDate(p.start)}.`) + (dirty ? " Showing unsaved changes." : "");
    }
    $("#board-title").textContent = isComp ? data.comp.name || "Clan Showdown" : "Clan Members";

    let cols = [
      ["name", "Member"], ["pGems", "Gems " + scope], ["pXp", "XP " + scope],
      ["gems", "Lifetime gems donated"], ["xp", "Lifetime XP contributed"], ["lastT", "Last screenshot"],
    ];
    if (isComp && !unlocked) cols = [["name", "Member"], [data.comp.metric, METRIC_SHORT[data.comp.metric]], ["lastT", "Last screenshot"]];
    if (!cols.some(([k]) => k === sortKey)) { sortKey = isComp ? data.comp.metric : "pGems"; sortDir = -1; }

    const val = (r, k) => (k === "name" ? r.name.toLowerCase() : r[k] ?? -Infinity);
    rows.sort((a, b) => {
      const va = val(a, sortKey), vb = val(b, sortKey);
      // Ties fall back to lifetime XP, except on the visitor showdown board, where that value is hidden.
      return (va < vb ? -1 : va > vb ? 1 : 0) * sortDir || (isComp && !unlocked ? 0 : b.xp - a.xp) || a.name.localeCompare(b.name);
    });

    const imgCols = isComp ? [["name", "Member"], [data.comp.metric, ""]] : cols.filter(([k]) => k !== "lastT");
    lastBoard = {
      isComp, rows: rows.slice(), cols: imgCols,
      heading: isComp ? data.comp.name || "Clan Showdown" : view === "custom" ? `${shortDate(p.start)} to ${shortDate(p.end - 1)}` : `Clan Standings: ${shortDate(p.start)} to ${shortDate(p.end)}`,
      sub: isComp ? [compTiming(), `Ranked by ${METRICS[data.comp.metric].replace(/^\w/, (ch) => ch.toLowerCase()).replace(/^xP/, "XP")}`].filter(Boolean).join(" · ") : view === "custom" ? "Gains from each member's last screenshot before the first day" : pre ? "Starting points for the first period" : "Gains since the period started",
      status: isComp ? compStatus().text : "", badge: isComp ? (compLive() ? "LIVE" : "FINAL") : "",
      metricLabel: isComp ? METRIC_SHORT[data.comp.metric] : "", scopeShort: view === "custom" ? "in range" : "this period",
    };
    const th = cols.map(([k, label]) => `<th scope="col" class="${isComp && k === data.comp.metric ? "picked" : ""}"><button type="button" data-sort="${k}" ${sortKey === k ? `aria-sort="${sortDir < 0 ? "descending" : "ascending"}"` : ""}>${label}${sortKey === k ? (sortDir < 0 ? " ▾" : " ▴") : ""}</button></th>`).join("");
    if (!rows.length) {
      $("#board").innerHTML = `<tbody><tr><td colspan="7"><div class="empty"><h3>No members yet</h3><p class="muted">Unlock the editor at the bottom of the page and add a clan member screenshot to start.</p></div></td></tr></tbody>`;
      return;
    }
    const gainCell = (v, cls, r) => pre
      ? `<td class="num muted" title="Starting point for the first period">start</td>`
      : v == null
      ? (r.baselineOnly ? `<td class="num muted" title="First screenshot. Gains show from the next one.">new</td>` : `<td class="num muted" title="No gem number on file for this member yet">–</td>`)
      : `<td class="num gain ${v === 0 ? "zero" : cls}">${v === 0 ? "0" : signed(v)}</td>`;
    const cell = (k, r) => k === "pGems" ? gainCell(r.pGems, "gem", r)
      : k === "pXp" ? gainCell(r.pXp, "xp", r)
      : k === "gems" || k === "xp" ? `<td class="num${isComp && !unlocked ? " big-score" : ""}">${fmt(r[k])}</td>`
      : k === "lastT" ? `<td class="num muted small">${dateFmt(r.lastT, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}</td>`
      : "";
    const noUpd = isComp ? "no screenshot since the start" : "no update " + scope;
    $("#board").innerHTML = `<thead><tr><th scope="col">#</th>${th}</tr></thead><tbody>` + rows.map((r, i) => `
      <tr>
        <td class="rankno">${i + 1}</td>
        <td><div class="who"><b>${esc(r.name)}</b><span>${r.rank ? `<span class="chip r-${r.rank.toLowerCase().replace(/[^a-z]/g, "")}">${esc(r.rank)}</span>` : ""} ${!r.updated && !pre ? `<span class="chip warn">${noUpd}</span>` : ""}</span></div></td>
        ${cols.slice(1).map(([k]) => cell(k, r)).join("")}
      </tr>`).join("") + "</tbody>";
    $("#board").classList.toggle("comp-board", isComp && !unlocked);
  }

  // ---------- standings image (PNG / JPG) ----------
  // Drawn on a canvas in the game's window style from the board that's on screen right now.
  // Showdown images always show only the ranking measure, like the visitor board.
  let lastBoard = null;
  const IMG_LABELS = { pGems: "Gems", pXp: "XP", gems: "Lifetime gems", xp: "Lifetime XP" };

  function rr(g, x, y, w, h, r) {
    g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }
  function outlined(g, text, x, y, fill, stroke, width) {
    g.lineJoin = "round"; g.lineWidth = width; g.strokeStyle = stroke; g.strokeText(text, x, y);
    g.fillStyle = fill; g.fillText(text, x, y);
  }
  function fitText(g, text, max) {
    if (g.measureText(text).width <= max) return text;
    while (text.length > 1 && g.measureText(text + "…").width > max) text = text.slice(0, -1);
    return text + "…";
  }
  const RANK_COLORS = { leader: "#8e3fe0", coleader: "#b04fc9", elder: "#2f9e1e", veteran: "#1f74c8" };

  async function drawStandings() {
    const b = lastBoard;
    const D = "'Lilita One', 'Arial Rounded MT Bold', sans-serif", B = "'Fira Sans', 'Segoe UI', sans-serif";
    try { await Promise.all([document.fonts.load(`40px ${D}`), document.fonts.load(`700 22px ${B}`), document.fonts.load(`600 16px ${B}`)]); } catch {}
    const valCols = b.cols.filter(([k]) => k !== "name");
    const W = Math.max(900, 560 + 175 * valCols.length);
    // Showdown images go straight from the Pink Cat banner to the table; the others keep a heading bar.
    const rowH = 56, headH = b.isComp ? 0 : 104, headGap = b.isComp ? 0 : 24, top = 70;
    const listTop = top + 52 + headH + headGap + 34; // window top + banner room + heading + gap + column labels
    const H = listTop + b.rows.length * (rowH + 6) + 92;
    const S = 2, cv = document.createElement("canvas");
    cv.width = W * S; cv.height = H * S;
    const g = cv.getContext("2d");
    g.scale(S, S);

    // world: stone blocks
    g.fillStyle = "#0a1424"; g.fillRect(0, 0, W, H);
    for (let y = 0; y < H; y += 64) for (let x = 0; x < W; x += 64) {
      g.fillStyle = "#1b2738"; g.fillRect(x + 2, y + 2, 61, 61);
      g.fillStyle = "#223146"; g.beginPath(); g.moveTo(x + 2, y + 2); g.lineTo(x + 40, y + 2); g.lineTo(x + 2, y + 40); g.fill();
    }
    g.fillStyle = "rgba(10,20,36,.55)"; g.fillRect(0, 0, W, H);

    // window frame
    const wx = 30, ww = W - 60, wh = H - top - 50;
    rr(g, wx - 2, top - 2, ww + 4, wh + 4, 24); g.fillStyle = "#9a7a00"; g.fill();
    rr(g, wx, top, ww, wh, 22); g.fillStyle = "#f6c700"; g.fill();
    const og = g.createLinearGradient(0, top, 0, top + wh); og.addColorStop(0, "#a7bb1d"); og.addColorStop(1, "#74870d");
    rr(g, wx + 7, top + 7, ww - 14, wh - 14, 16); g.fillStyle = og; g.fill();
    const bx = wx + 19, bw = ww - 38;
    rr(g, bx, top + 19, bw, wh - 38, 12); g.fillStyle = "#f6efd3"; g.fill();

    // title banner
    g.textBaseline = "middle"; g.textAlign = "center";
    g.font = `44px ${D}`;
    const t1 = "Pink Cat ", t2 = "[PINK]";
    const tw = g.measureText(t1 + t2).width, pw = tw + 90, ph = 68, px = W / 2 - pw / 2, py = top - 40;
    rr(g, px, py, pw, ph, ph / 2);
    const bg = g.createLinearGradient(0, py, 0, py + ph); bg.addColorStop(0, "#b6e9fb"); bg.addColorStop(0.42, "#b6e9fb"); bg.addColorStop(0.42, "#7dd0f0"); bg.addColorStop(1, "#7dd0f0");
    g.fillStyle = bg; g.fill(); g.lineWidth = 4; g.strokeStyle = "#2f8ec4"; g.stroke();
    g.textAlign = "left";
    const tx = W / 2 - tw / 2, ty = py + ph / 2 + 2;
    outlined(g, t1, tx, ty, "#ffffff", "#163a57", 8);
    outlined(g, t2, tx + g.measureText(t1).width, ty, "#ffc6ea", "#163a57", 8);

    // heading plate
    const hx = bx + 16, hw = bw - 32, hy = top + 52;
    g.textAlign = "center";
    if (headH) {
      rr(g, hx, hy, hw, headH, 14); g.fillStyle = "#1d5b86"; g.fill();
      g.font = `34px ${D}`; g.fillStyle = "#fff"; g.fillText(fitText(g, b.heading, hw - 40), W / 2, hy + 40);
      g.font = `600 17px ${B}`; g.fillStyle = "#d6effa"; g.fillText(fitText(g, b.sub, hw - 40), W / 2, hy + 76);
    }

    // list panel + column labels
    const ly = hy + headH + headGap;
    rr(g, hx, ly, hw, H - ly - 70, 12); g.fillStyle = "#a3def0"; g.fill();
    const valW = 175, valRight = (i) => hx + hw - 20 - (valCols.length - 1 - i) * valW;
    const nameX = hx + 84;
    g.font = `700 13px ${B}`; g.fillStyle = "#1d5b86"; g.textAlign = "left";
    g.fillText("#", hx + 26, ly + 20); g.fillText("MEMBER", nameX, ly + 20);
    g.textAlign = "right";
    valCols.forEach(([k], i) => g.fillText((b.isComp ? b.metricLabel : IMG_LABELS[k] + (k === "pGems" || k === "pXp" ? " " + b.scopeShort : "")).toUpperCase(), valRight(i), ly + 20));

    // rows
    b.rows.forEach((r, i) => {
      const y = ly + 34 + i * (rowH + 6), x = hx + 8, w = hw - 16;
      rr(g, x, y, w, rowH, 10); g.fillStyle = i % 2 ? "#ece4c6" : "#f6efd3"; g.fill();
      const cy = y + rowH / 2 + 1;
      // place: medals for the top three
      g.textAlign = "center";
      if (i < 3) {
        const medal = ["#f6c700", "#b9c4cf", "#d08a4a"][i], rim = ["#9a7a00", "#6d7a87", "#7d4a1d"][i];
        g.beginPath(); g.arc(hx + 34, cy, 19, 0, Math.PI * 2); g.fillStyle = medal; g.fill(); g.lineWidth = 3; g.strokeStyle = rim; g.stroke();
        g.font = `22px ${D}`; outlined(g, String(i + 1), hx + 34, cy + 1, "#ffffff", rim, 5);
      } else { g.font = `22px ${D}`; g.fillStyle = "#1d5b86"; g.fillText(String(i + 1), hx + 34, cy + 1); }
      // name + rank chip
      g.textAlign = "left"; g.font = `700 22px ${B}`; g.fillStyle = "#163a57";
      const nameMax = valRight(0) - valW + 20 - nameX - 110;
      const nm = fitText(g, r.name, nameMax);
      g.fillText(nm, nameX, cy);
      if (r.rank) {
        const rx = nameX + g.measureText(nm).width + 12;
        g.font = `700 12px ${B}`;
        const cw = g.measureText(r.rank).width + 18;
        rr(g, rx, cy - 11, cw, 22, 11); g.fillStyle = RANK_COLORS[r.rank.toLowerCase().replace(/[^a-z]/g, "")] || "#5b6b7a"; g.fill();
        g.fillStyle = "#fff"; g.fillText(r.rank, rx + 9, cy + 1);
      }
      // values
      g.textAlign = "right"; g.font = `24px ${D}`;
      valCols.forEach(([k], j) => {
        const v = r[k];
        let text, color = "#163a57";
        if (k === "pGems" || k === "pXp") {
          if (v == null) { text = r.baselineOnly ? "new" : "–"; color = "#7a8a99"; }
          else if (v === 0) { text = "0"; color = "#7a8a99"; }
          else { text = signed(v); color = k === "pGems" ? "#1777c2" : "#3b9a0e"; }
        } else text = fmt(v);
        g.fillStyle = color; g.fillText(text, valRight(j), cy + 1);
      });
    });

    // footer
    g.textAlign = "center"; g.font = `600 15px ${B}`; g.fillStyle = "#bfe2f5";
    g.fillText(`Standings as of ${dateFmt(Date.now(), { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" })}`, W / 2, H - 24);
    return cv;
  }

  // ---------- countdown ----------
  function tick() {
    const now = Date.now();
    const end = currentEnd(now);
    let s = Math.max(0, Math.floor((end - now) / 1000));
    const d = Math.floor(s / 86400); s -= d * 86400;
    const h = Math.floor(s / 3600); s -= h * 3600;
    const m = Math.floor(s / 60); s -= m * 60;
    const p2 = (n) => String(n).padStart(2, "0");
    const slot = (v, unit) => `<div class="slot"><b>${v}</b><span>${unit}</span></div>`;
    $("#clock").innerHTML = slot(d, d === 1 ? "day" : "days") + slot(p2(h), "hrs") + slot(p2(m), "min") + slot(p2(s), "sec");
    const utc = new Date(end).toUTCString().replace(":00 GMT", " UTC");
    $("#deadline-text").textContent = `${utc} · your time: ${dateFmt(end, { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}`;
    if (periods(now).length !== periods(now - 1000).length) render();
    else if (data.comp && compEnd() <= now && compEnd() > now - 1000) { render(); if (unlocked) renderEditor(); }
    else if (view === "comp") drawCompHead();
  }

  // ---------- editor ----------
  // ---------- Clan Showdown: staff controls ----------
  let compDraft = null; // settings for a showdown that hasn't started yet
  const LENGTHS = [["", "No end date (close it by hand)"], ["1", "1 day"], ["3", "3 days"], ["7", "7 days"], ["14", "14 days"], ["30", "30 days"], ["date", "Until a date I pick"]];
  const lastEntryBefore = (m, ms) => m.entries.filter((e) => Date.parse(e.t) < ms).sort((a, b) => Date.parse(a.t) - Date.parse(b.t)).pop();
  function newDraft() {
    const start = Date.now();
    const base = {};
    data.members.forEach((m) => { const e = lastEntryBefore(m, start + 60e3); base[key(m.name)] = { xp: e ? e.xp : null, gems: e ? e.gems : null }; });
    return { name: "Clan Showdown", start: localInput(start), len: "", endAt: localInput(start + 7 * DAY), metric: "pXp", base, newMembers: [] };
  }
  // "name: 1.234.567" per line. Names match ignoring case, then ignoring symbols, then allowing one typo.
  function parseList(text) {
    const out = { matched: [], unknown: [] };
    const squash = (s) => s.toLowerCase().replace(/[^a-z0-9]/g, "");
    text.split(/\r?\n/).forEach((line) => {
      const m = line.match(/^\s*([^:]+?)\s*[:=\-–]\s*([\d.,'\s]+)\s*$/);
      if (!m) return;
      const name = m[1].trim(), xp = +m[2].replace(/\D/g, "");
      if (!m[2].replace(/\D/g, "")) return;
      const hit = data.members.find((x) => key(x.name) === key(name))
        || data.members.find((x) => squash(x.name) === squash(name))
        || (squash(name).length >= 5 ? data.members.find((x) => lev(squash(x.name), squash(name)) <= 1) : null);
      if (hit) out.matched.push({ member: hit, typed: name, xp }); else out.unknown.push({ name, xp });
    });
    return out;
  }
  function lengthToEnd(startMs, len, endAt) {
    if (!len) return null;
    if (len === "date") { const t = Date.parse(endAt); return isNaN(t) ? null : new Date(t).toISOString(); }
    return new Date(startMs + +len * DAY).toISOString();
  }

  function wireCompPanel() {
    const panel = $("#comp-panel");
    if (!panel) return;
    const c = data.comp;
    const num = (v) => (String(v).replace(/\D/g, "") === "" ? null : +String(v).replace(/\D/g, ""));
    const baseOf = (m) => { const store = c ? c.base : compDraft.base; return (store[key(m.name)] = store[key(m.name)] || { xp: null, gems: null }); };
    panel.querySelectorAll("[data-base]").forEach((inp) => {
      inp.addEventListener("change", () => {
        const m = data.members[+inp.dataset.m];
        baseOf(m)[inp.dataset.base] = num(inp.value);
        if (c) change();
      });
    });
    $("#cd-apply").onclick = () => {
      const r = parseList($("#cd-paste").value);
      r.matched.forEach(({ member, xp }) => { baseOf(member).xp = xp; });
      let note = `${r.matched.length} matched.`;
      const typos = r.matched.filter((x) => key(x.typed) !== key(x.member.name)).map((x) => `${x.typed} → ${x.member.name}`);
      if (typos.length) note += ` Matched by spelling: ${typos.join(", ")}.`;
      if (!c) {
        compDraft.newMembers = r.unknown;
        if (r.unknown.length) note += ` New members (XP only): ${r.unknown.map((u) => u.name).join(", ")}.`;
      } else if (r.unknown.length) note += ` Not in the tracker, skipped: ${r.unknown.map((u) => u.name).join(", ")}.`;
      if (c) change(); else renderEditor();
      $("#cd-paste-note").textContent = note;
    };
    if (!c) {
      const d = compDraft;
      $("#cd-name").oninput = (e) => { d.name = e.target.value; };
      $("#cd-start").onchange = (e) => { d.start = e.target.value; };
      $("#cd-len").onchange = (e) => { d.len = e.target.value; renderEditor(); };
      if ($("#cd-end")) $("#cd-end").onchange = (e) => { d.endAt = e.target.value; };
      $("#cd-metric").onchange = (e) => { d.metric = e.target.value; };
      $("#cd-go").onclick = () => {
        const startMs = isNaN(Date.parse(d.start)) ? Date.now() : Date.parse(d.start);
        const base = {};
        Object.entries(d.base).forEach(([k, v]) => { base[k] = { xp: v.xp, gems: v.gems }; });
        d.newMembers.forEach((n) => {
          if (data.members.some((x) => key(x.name) === key(n.name))) return;
          data.members.push({ name: n.name, rank: "", entries: [{ t: new Date(startMs - 60e3).toISOString(), gems: null, xp: n.xp }] });
          base[key(n.name)] = { xp: n.xp, gems: null };
        });
        data.comp = { name: d.name.trim() || "Clan Showdown", start: new Date(startMs).toISOString(), end: lengthToEnd(startMs, d.len, d.endAt), metric: d.metric, base, hidden: false };
        compDraft = null;
        view = "comp";
        change();
      };
      return;
    }
    $("#cc-name").onchange = (e) => { c.name = e.target.value.trim() || "Clan Showdown"; change(); };
    $("#cc-metric").onchange = (e) => { c.metric = e.target.value; sortKey = c.metric; sortDir = -1; change(); };
    $("#cc-len").onchange = (e) => {
      const v = e.target.value;
      if (v === "date") { $("#cc-end").closest("label").hidden = false; return; }
      c.end = lengthToEnd(Date.parse(c.start), v, null); change();
    };
    $("#cc-end").onchange = (e) => { const t = Date.parse(e.target.value); if (!isNaN(t)) { c.end = new Date(t).toISOString(); change(); } };
    const twoStep = (btn, label, act) => { btn.onclick = () => { if (btn.dataset.confirm) act(); else { btn.dataset.confirm = "1"; btn.textContent = label; } }; };
    if ($("#cc-close")) twoStep($("#cc-close"), "Click again to end it now", () => { c.end = new Date().toISOString(); change(); });
    if ($("#cc-reopen")) $("#cc-reopen").onclick = () => { c.end = null; change(); };
    $("#cc-hide").onclick = () => { c.hidden = !c.hidden; change(); };
    twoStep($("#cc-delete"), "Click again to delete it for good", () => { data.comp = null; view = "period"; change(); });
  }

    $("#lock").onclick = () => { unlocked = false; ss.del("pc-unlocked"); render(); renderEditor(); };
    $("#manual").onclick = () => { addCard(null); };
